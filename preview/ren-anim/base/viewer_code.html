<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anteprima 3D di Ren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
/* The fighter on a stage: the game's dark night blue and its orange; Bebas for names, Barlow italic for the controls. */
:root{--dark:#14121c;--panel:rgba(20,18,28,.78);--line:rgba(255,255,255,.14);--ink:#f4f1fb;--dim:#b9b3c9;--orange:#ff7a1a;--cyan:#35d8ff;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--body:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--dark);color:var(--ink);font-family:var(--body);font-style:italic;font-weight:700;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:var(--dark) center 80%/cover no-repeat}
#stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,28,.35),rgba(20,18,28,.05) 40%,rgba(20,18,28,.75))}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;cursor:grab}
#view:active{cursor:grabbing}
.ui{position:fixed;z-index:2;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
#name{font-family:var(--display);font-style:normal;font-size:52px;line-height:.9;letter-spacing:.04em;transform:skewX(-8deg);text-shadow:0 3px 0 var(--orange),0 6px 14px #000}
#name small{display:block;font-family:var(--body);font-style:italic;font-size:16px;letter-spacing:.06em;color:var(--dim);text-shadow:0 1px 3px #000;transform:none}
#now{font-size:18px;color:var(--orange);text-shadow:0 1px 3px #000;text-align:right;min-width:0}
#now small{display:block;color:var(--dim);font-size:14px}
#bottom{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:17px;letter-spacing:.03em;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 14px 6px;
  transform:skewX(-10deg);cursor:pointer;transition:transform .08s,background .15s}
button>span{display:inline-block;transform:skewX(10deg)}
button:active{transform:skewX(-10deg) scale(.93)}
button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1a0f05}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.opt{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:15px}
.opt button{font-size:15px;padding:5px 10px 4px}
#hint{color:var(--dim);font-size:14px;text-shadow:0 1px 3px #000}
@media (max-height:430px){#name{font-size:40px}button{font-size:15px;padding:5px 11px 4px}.opt button{font-size:13px}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="ui" id="top"><div id="name">REN<small>Anteprima 3D, senza giocare</small></div><div id="now"></div></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
// Every balance number lives here. Units: logic in mm, mm/frame and frames (60 = 1 s);
// in fx, cam and arena (graphics only) metres and milliseconds. Later tasks add their sections.
const CFG={
  ver:1,
  stage:{half:6000, startX:1200, maxSep:5500},
  body:{push:260, hurt:250, head:150, headH:300, h:1800, hCrouch:1050, hAir:1500, passY:1000, hp:1000, meterMax:3000},   // in the air above passY a fighter neither pushes nor is pushed
  walk:{f:75, b:58},
  jump:{squat:4, v:147, g:7, vxF:62, vxB:-52, superV:180, land:2, landAtk:5},
  dash:{f:{n:18, v0:170, v1:40}, b:{n:20, v0:150, v1:30}, tap:10},   // speed eases from v0 to v1 over n frames; tap = double-tap window
  input:{hold:12, chargeShow:4, both:3, buffer:8},
  phys:{pushFric:2},
  combo:{scaleFrom:3, scaleStep:10, minScale:30, decayFrom:6, decay:1, minStun:6, juggleMax:6, lift:60},
  stop:{light:6, mid:8, heavy:11, spec:8, thr:10, ko:40, blockLight:5, blockHeavy:8},
  meter:{hit:1, block:.5, taken:.5},
  knock:{ground:36, getup:16, roll:22, rollDist:1300},
  // Throw: s/a = startup/active frames, range = max centre distance, whiff = recovery of a miss, anim = frames of a
  // grab, hitF = the grab's frame of the damage, then the opponent is knocked down (vx away, vy up). No height: no block.
  thr:{range:900, s:4, a:2, whiff:24, anim:40, hitF:30, dmg:120, vx:60, vy:60, stop:'thr', knock:true},
  // Special (energy shot): spawn = frame the projectile appears, rec = frames after it; speed in mm/frame; box = half-size;
  // x, y = spawn point (forward of the fighter, from the ground); hs/bs/chip as a move's (chip = damage on a block).
  spec:{spawn:14, rec:30, speed:120, box:150, dmg:70, hs:20, bs:16, chip:8, x:500, y:1100, h:'mid', push:0, stop:'spec'},
  // Rounds: intro/end in frames, timerS in seconds, wins to take the match; ko = the fall of a fighter KO'd on the ground.
  round:{intro:100, timerS:99, end:150, wins:2, ko:{vx:50, vy:50}},
  training:{refill:60},   // frames out of a combo before health refills
  dummy:{min:30, max:60},   // the random dummy changes what it does every min..max frames
  // The plan's move table. s/a/r = startup/active/recovery frames (r 'land' = until landing, then jump.landAtk);
  // hs/bs = hitstun/blockstun; h = height; box = [x0,x1,y0,y1] mm, x forward from the centre, y from the feet;
  // push = pushback speed of the one hit; stop = hitstop class. Chains, once the move has touched: tapP/tapK = move
  // for a P/K tap, heavy = true (any heavy of the posture) or a list, spec = into the Special, jc = super jump (hit only).
  // limb = model part that must sit in the box (Task 8). Effects: knock (knocked down with vx, vy), launch (juggle with
  // vx, vy), airKnock (knocked down, airborne opponent only), spike (slammed down with vx, vy, airborne opponent only).
  // p3 pushes like p1 and p2 (24, not the plan's 35), so P,P,P then the held P lands all 4 hits from the walk-up range
  // (up to ~790 mm apart; with 35 the defender slid out of hp's reach from beyond point blank).
  moves:{
    p1:{s:4, a:2, r:7, dmg:30, hs:14, bs:10, h:'mid', box:[200,700,900,1550], push:24, stop:'light', tapP:'p2', tapK:'k1', heavy:true, spec:true, limb:'handL'},
    p2:{s:5, a:3, r:9, dmg:35, hs:15, bs:11, h:'mid', box:[200,760,900,1550], push:24, stop:'light', tapP:'p3', tapK:'k1', heavy:true, spec:true, limb:'handR'},
    p3:{s:7, a:3, r:14, dmg:50, hs:18, bs:12, h:'mid', box:[200,780,900,1500], push:24, stop:'mid', heavy:true, spec:true, limb:'handL'},
    k1:{s:6, a:3, r:10, dmg:40, hs:15, bs:11, h:'mid', box:[200,820,700,1100], push:24, stop:'light', tapP:'p2', tapK:'k2', heavy:true, spec:true, limb:'footL'},
    k2:{s:8, a:3, r:15, dmg:55, hs:18, bs:12, h:'mid', box:[250,900,1100,1500], push:30, stop:'mid', heavy:true, spec:true, limb:'footR'},
    hp:{s:12, a:4, r:18, dmg:90, hs:22, bs:15, h:'mid', box:[250,900,900,1550], push:40, stop:'heavy', heavy:['chk'], spec:true, limb:'handR'},
    hk:{s:14, a:4, r:20, dmg:100, bs:16, h:'mid', box:[300,1000,1000,1600], stop:'heavy', spec:true, limb:'footR', knock:true, vx:70, vy:70},
    cp:{s:5, a:2, r:8, dmg:25, hs:13, bs:10, h:'mid', box:[200,700,700,1000], push:22, stop:'light', tapP:'p2', tapK:'ck', heavy:true, spec:true, limb:'handR'},
    ck:{s:6, a:3, r:10, dmg:30, hs:14, bs:10, h:'low', box:[250,900,0,300], push:24, stop:'light', heavy:true, spec:true, limb:'footL'},
    chp:{s:9, a:4, r:20, dmg:80, hs:20, bs:14, h:'mid', box:[150,650,1300,2100], push:30, stop:'heavy', spec:true, limb:'handR', airKnock:{vx:30, vy:50}},
    chk:{s:11, a:4, r:22, dmg:70, bs:14, h:'mid', box:[200,700,800,1900], stop:'heavy', spec:true, jc:true, limb:'footR', launch:true, vx:10, vy:160},
    jp:{s:5, a:4, r:'land', dmg:40, hs:15, bs:10, h:'high', box:[150,600,300,900], push:20, stop:'light', tapK:'jk', heavy:true, limb:'handR'},
    jk:{s:6, a:5, r:'land', dmg:45, hs:16, bs:11, h:'high', box:[150,700,-300,500], push:20, stop:'light', heavy:true, limb:'footR'},
    jhp:{s:10, a:4, r:'land', dmg:75, hs:20, bs:13, h:'high', box:[150,700,0,800], push:20, stop:'heavy', limb:'handR', spike:true, vx:0, vy:-120},
    jhk:{s:11, a:5, r:'land', dmg:80, hs:21, bs:14, h:'high', box:[150,800,-400,400], push:20, stop:'heavy', limb:'footR'},
  },
  // Side camera (graphics only, metres): fov = vertical degrees; dist from dist0 out to distMax so that both fighters
  // fit with marginX each side and the highest head with marginTop above it; the ground always sits at footScreen of
  // the screen height; smooth = share of the gap closed per drawn frame; xMax = limit of the camera's x.
  cam:{fov:30, dist0:6.5, distMax:9.6, footScreen:.86, marginX:1.0, marginTop:.35, smooth:.15, xMax:3.0},
  // Painted backdrop: footRow = image row (share of its height) where the feet stand; cover = times the smallest scale
  // that fills the screen; parX = image widths of shift per metre of camera x; zoomPar = exponent of the zoom with
  // the camera distance; contrast/lift = colour grade; flow/streak/wobble = the waterfall's flow speed, streak
  // strength and shimmer; leaves = number of drifting leaves. footRow and cover keep the waterfall's crest and the
  // temple on top (image rows 213-255) in view, with some sky, on 20:9 phones; footRow stays on the painted floor.
  arena:{footRow:.83, cover:1.1, parX:.012, zoomPar:.3, contrast:.9, lift:.03, flow:.35, streak:.22, wobble:.002, leaves:10},
  // Fighter animation (graphics only): blend = frames over which the pose eases into a new free or movement action;
  // the Meshy fighters ease over model frames (their clips' poses differ more: a mid-stride walk to the wide stance) and
  // ease a strike in over its first strikeIn frames (at most its startup minus 1: the active frames stay exact).
  anim:{blend:5, model:10, strikeIn:4},
  // Meshy fighters (graphics only, e_model.js): per act the clip (Meshy action id, 'a89') and its times in seconds.
  // loop = cycle on S.frame; walk = clip time from the distance walked (1 = the clip's planted-foot speed, measured at
  // load; else that speed in m/s); at = a held pose; t = [t0, t1] of a move: startup from t0 to the hit frame (found at
  // load: the frame whose limb point lies deepest in the move's box, both facings), held through the active frames,
  // recovery to t1 (air moves: in 8 frames, then held until the landing); k = [[x, t], ...] piecewise linear in F.af
  // (in u, 0 at take-off to 1 falling, for the air and flight poses); low/up = hips and legs from one entry, the rest
  // from the other. Options: y = the hips' height in m (poses in the air; 'cap' = never above the rest pose, for clips
  // that hop while the sim stays on the floor), plant = feet held by IK where the t[0] pose has them ('L', 'R', 'LR':
  // grounded strikes neither slide nor lift the support foot), pitch = degrees leaning forward (air attacks
  // strike downward), limb = the hitting point when the clip strikes with another limb than CFG.moves names.
  // kick = a base entry whose leg ('L'/'R') reaches 'to' (ankle, model space m) by IK: in startup, held, back in recovery.
  clips:{
    idle:{c:'a89', loop:1}, intro:{c:'a89', loop:1}, walkF:{c:'a21', walk:1}, walkB:{c:'a20', walk:1},
    dashF:{c:'a16', walk:4}, dashB:{c:'a20', walk:1},
    crouch:{low:{c:'a54', at:.67}, up:{c:'a89', loop:1}}, guard:{c:'a138', at:1}, guardC:{low:{c:'a54', at:.67}, up:{c:'a138', at:1}},
    jumpSquat:{c:'a466', k:[[0,0],[4,.3]]}, air:{c:'a466', k:[[0,.53],[.5,.8],[1,1.07]], y:.95}, landing:{c:'a466', k:[[0,1.1],[5,1.4]]},
    p1:{c:'a191', t:[.2,1], plant:'LR'}, p2:{c:'a192', t:[.3,1.2], plant:'LR'}, p3:{c:'a193', t:[0,.8], plant:'LR'},
    hp:{c:'a210', t:[1.45,2.6], plant:'LR'}, k1:{c:'a209', t:[.35,1.15], limb:'footR', plant:'L'},
    k2:{c:'a215', t:[.5,1.6], plant:'L', y:'cap'}, hk:{c:'a215', t:[.3,1.6], plant:'L', y:'cap'},
    cp:{low:{c:'a54', at:.67}, up:{c:'a192', t:[.3,1.2]}},
    ck:{kick:{low:{c:'a54', at:.67}, up:{c:'a89', loop:1}}, leg:'L', to:[.1,.1,.72]},
    chp:{c:'a194', t:[.1,1], plant:'LR'}, chk:{c:'a422', t:[0,1], limb:'footL', plant:'R', y:'cap'},
    jp:{c:'a457', t:[1.1,1.6], y:.95, pitch:20, limb:'handL'}, jhp:{c:'a457', t:[1.1,1.6], y:.95, pitch:30, limb:'handL'},
    jk:{c:'a422', t:[.13,.6], y:.95, pitch:40, limb:'footL'}, jhk:{c:'a422', t:[.13,.6], y:.95, pitch:45, limb:'footL'},
    spec:{c:'a214', k:[[0,.33],[14,1.53],[24,2.1],[44,3.2]]},
    thr:{c:'a421', k:[[0,.6],[6,1.4]]}, thrHit:{c:'a421', k:[[0,1.4],[22,2],[30,2.53],[40,3.3]]}, thrWhiff:{c:'a421', k:[[0,1.4],[24,.3]]},
    hitStun:{c:'a174', k:[[0,.47],[8,1.1]]}, fly:{c:'a7', k:[[0,.1],[1,.6]], y:.6}, down:{c:'a7', at:1.5},
    getup:{c:'a3', k:[[0,.15],[16,1.6]]}, roll:{c:'a3', k:[[0,.15],[22,1.6]]}, win:{c:'a17', k:[[0,0],[18,.3]]},
  },
  // The "Ren dipinto" look (Denis's choices, 7/11/2026), off in the game until he approves it in the viewer: fists =
  // the fingers curled on their own bones (ASSETS '<char>/<char>_look.json|bin', tools/ren_look.py), open in the acts
  // of openHands; headUp = degrees the head is raised in every pose (the face shows at the game's camera);
  // spikes = anime hair spikes on the sides, back and top of the hair; faceLine = a thin outline on the front of the face
  // and on the fingers; line = the outline {w: width m, back: m pushed away from the camera, so it shows around the
  // silhouette and not through the folds of the body, the hair and the hands}, null: the game's (e_model MD_OUTLINE);
  // flatFace = the front of the head without the toon light (the drawing painted there has its own shading); sash = the
  // sash's tails as ribbons of their own, swinging with gravity (e_model mdSash) instead of painted on the legs;
  // faceShape = the shape as drawn (tools/ren_look.py drawn_shape: the face smooth below the eyes with a small nose,
  // the fringe off the eyes, the collar's points) and the drawn face's features, the jaw's line and the neck's shadow
  // under it as a decal of their own (e_model mdFaceMat); head = the new head from Denis's 3-view sheet (tools/ren_head.py:
  // its old head, neck and collar's top hidden); paint = the drawing painted on the model (tools/paint_from_drawing.py,
  // ASSETS '<char>/<char>_painted.jpg') instead of Meshy's own paint; clips = CFG.clips entries of its own (by act).
  looks:{ren:{fists:false, openHands:['spec','thr','thrWhiff'], headUp:0, spikes:false, faceLine:false, line:null, flatFace:false, sash:false, faceShape:false, head:false, smoothNormals:false,
    paint:false, clips:null}},
  // Game feel (graphics only, metres and milliseconds; on=false skips every effect): flashMs/squashMs = white flash and
  // squash of the fighter hit, squash = [x and z, y] scale at its peak, shakeHeavy/shakeKO = [camera shake amplitude m,
  // duration ms], spark = size m of the hit spark (light, heavy, block; hold = share of its life at full size and opacity), proj = size m
  // of the projectile's white core, halo and coloured rim.
  fx:{on:true, flashMs:60, squashMs:110, squash:[1.1,.9], shakeHeavy:[.06,180], shakeKO:[.12,400], spark:{light:.45, heavy:.95, block:.6, hold:.4}, proj:{core:.36, halo:.8, rim:.95}},
  // HUD (frames): chipDelay = wait before the red lost part of a bar drains, chipRate = bars drained per second,
  // comboHide = how long the combo counter stays after its combo ends.
  hud:{chipDelay:30, chipRate:.8, comboHide:60},
  menu:{endGuardMs:600},   // the end screen ignores confirm/back this long, so a mashing player does not skip the result
  loop:{maxSteps:4},   // real-time loop: at most this many fixed steps per drawn frame
};

// Fight simulation core: buttons, state, seeded generator, the fixed step, physics, pushboxes, facing, and hits
// (contacts, damage, hitstop, hitstun, juggle, knockdown and getup).
// Pure and deterministic: integers only (mm, mm/frame, frames), no THREE, DOM, clock or Math.random.
// One step = one frame at 60 per second, fed one integer of buttons per player; graphics only read the state.

const BTN={U:1, D:2, L:4, R:8, P:16, K:32, S:64, DASH:128, GUARD:256};   // directions are absolute (L = screen left)

// af = frame of the current action (1 on its first frame); hold = frames P/K held (see inputPhase);
// prev = last frame's clean buttons; tap = last horizontal press {dir: BTN.L|BTN.R, f: frame}, dir 0 = none;
// land = recovery frames of the current landing; hit = the move in progress has touched (1 hit, 2 blocked);
// stun = hitstun frames left; inv = invulnerable frames left; juggle = hits taken in this juggle;
// buf = the command waiting for the fighter to be free ({cmd, left} frames); sj = this jump is a super jump;
// mute = P/K bits whose release (and heavy) is ignored until released, after a throw command (see readCommand).
function newFighter(side, char) {
  return {side, char, x: side ? CFG.stage.startX : -CFG.stage.startX, y: 0, vx: 0, vy: 0, face: side ? -1 : 1,
    hp: CFG.body.hp, meter: 0, act: 'idle', af: 0, air: false, stun: 0, combo: 0, comboDmg: 0, juggle: 0,
    hit: 0, inv: 0, hold: [0, 0], prev: 0, tap: {dir: 0, f: 0}, buf: {cmd: null, left: 0}, sj: false, land: 0, mute: 0};
}

// opts = {seed, mode: 'versus'|'training', chars: [c0, c1], dummy: 'fermo'|'casuale'}.
// Starts in the round-1 'intro'. timer = frames left in the round (-1 = none, in training); pf = frames in the
// phase; dum = the training dummy's state (c3_dummy.js); rf = frames each fighter has been out of a combo (training refill).
function simCreate(o) {
  const chars = o.chars || ['ren', 'kael'], training = o.mode === 'training';
  return {frame: 0, rng: o.seed | 0, mode: o.mode || 'versus', phase: 'intro', pf: 0, round: 1,
    timer: training ? -1 : CFG.round.timerS * 60, rf: [0, 0],
    wins: [0, 0], winner: -1, stop: 0, sides: [0, 1].map(i => ({team: [newFighter(i, chars[i])], cur: 0})),
    proj: [], ev: [], dummy: o.dummy || 'fermo', dum: [{act: null, left: 0}, {act: null, left: 0}]};
}

function fighterOf(S, side) { const s = S.sides[side]; return s.team[s.cur]; }

// Deep copy: the state is plain JSON (numbers, strings, booleans, null, arrays and objects).
function simClone(S) { return JSON.parse(JSON.stringify(S)); }

// 32-bit FNV-1a, in hex, of the state without this frame's events.
function simHash(S) {
  const {ev, ...state} = S, s = JSON.stringify(state);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x01000193);
  return (h >>> 0).toString(16).padStart(8, '0');
}

// Seeded generator (mulberry32 on the integer S.rng): an integer in [0, n).
function simRand(S, n) {
  const a = S.rng = S.rng + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) % n;
}

// Adds an event of this frame, {t, side, x, y, move, dmg, heavy}: at the fighter's position unless o overrides it.
function simEmit(S, t, F, o) {
  const e = {t, side: F.side, x: F.x, y: F.y, move: null, dmg: 0, heavy: false};
  S.ev.push(o ? Object.assign(e, o) : e);
}

// Input phase, before the command: SOCD-clean buttons (L+R = no horizontal, U+D = no vertical) and the hold
// counters. hold[i] = frames P (i=0) / K (i=1) has been held in this press; on the release frame it still holds
// the press length, so the command reader can tell a tap from a heavy, and the frame after it is back to 0.
function inputPhase(F, raw) {
  let b = raw & 511;   // the 9 BTN bits; a missing input becomes 0
  if ((b & BTN.L) && (b & BTN.R)) b &= ~(BTN.L | BTN.R);
  if ((b & BTN.U) && (b & BTN.D)) b &= ~(BTN.U | BTN.D);
  for (let i = 0; i < 2; i++) {
    const btn = i ? BTN.K : BTN.P;
    if (b & btn) F.hold[i] = F.prev & btn ? F.hold[i] + 1 : 1;
    else if (!(F.prev & btn)) F.hold[i] = 0;
  }
  return b;
}

// This frame's horizontal press if it completes a double tap (same direction twice within dash.tap frames), else 0.
function doubleTapDir(S, F, bits) {
  const h = bits & ~F.prev & (BTN.L | BTN.R);
  return h && h === F.tap.dir && S.frame - F.tap.f <= CFG.dash.tap ? h : 0;
}

// Input history, once the command has read it: this frame's buttons, the muted buttons still held and the last
// horizontal tap (a double tap uses the tap up, so a third press starts a new pair).
function rememberInput(S, F, bits) {
  F.mute &= bits;
  const h = bits & ~F.prev & (BTN.L | BTN.R);
  if (h) { F.tap.dir = doubleTapDir(S, F, bits) ? 0 : h; F.tap.f = S.frame; }
  F.prev = bits;
}

// Velocity, gravity and touchdown at y = 0.
function fighterPhysics(S, F) {
  F.x += F.vx;
  if (!F.air) return;
  F.y += F.vy; F.vy -= CFG.jump.g;
  if (F.y <= 0) { F.y = 0; F.vx = 0; F.vy = 0; F.air = false; touchdown(S, F); }
}

// Pushboxes, walls and maximum separation. Overlapping pushboxes split the overlap half and half, but not while
// either fighter is in the air above body.passY, so a jump can cross over. Walls stop the centres at
// ±(stage.half - body.push), and a fighter in the corner makes the other one take the whole push. Beyond
// stage.maxSep the excess is taken back from whoever moved away this frame (x0 = x before physics, by side).
function pushApart(a, b, x0) {
  const P2 = 2 * CFG.body.push, W = CFG.stage.half - CFG.body.push;
  const solid = a.y <= CFG.body.passY && b.y <= CFG.body.passY;
  const aLeft = a.x !== b.x ? a.x < b.x : a.face >= b.face;
  const l = aLeft ? a : b, r = aLeft ? b : a;
  if (solid && r.x - l.x < P2) { const ov = P2 - (r.x - l.x), h = ov >> 1; l.x -= h; r.x += ov - h; }
  l.x = Math.max(-W, Math.min(W, l.x)); r.x = Math.max(-W, Math.min(W, r.x));
  if (solid && r.x - l.x < P2) { if (l.x === -W) r.x = l.x + P2; else l.x = r.x - P2; }
  const ex = r.x - l.x - CFG.stage.maxSep;
  if (ex > 0) {
    const outL = Math.max(0, x0[l.side] - l.x), outR = Math.max(0, r.x - x0[r.side]);
    let tl = Math.min(outL, Math.max(ex >> 1, ex - outR));   // half each when both moved away
    const tr = Math.min(outR, ex - tl);
    tl += (ex - tl - tr) >> 1;   // more than this frame's motion (fighters placed by hand): split the rest
    l.x += tl; r.x -= ex - tl;
  }
}

// Fighters in a free ground state or landing turn to face the opponent (a jump, a dash, a move and a stun keep their
// facing). The landing turns so that back, forward and a dash pressed in it already count for the side it landed on.
function faceOpponent(F, O) { if ((FREE[F.act] || F.act === 'landing') && O.x !== F.x) F.face = O.x > F.x ? 1 : -1; }

// --- Hits ---

// Damage of the n-th hit of a combo, in %: full for the first scaleFrom-1 hits, then scaleStep less per hit, down to minScale.
function scaleFor(n) { const c = CFG.combo; return Math.max(c.minScale, 100 - c.scaleStep * Math.max(0, n - c.scaleFrom + 1)); }

// Hitstun of the n-th hit of a combo: base up to hit decayFrom-1, then decay frames less per hit, down to minStun.
function hitstunFor(base, n) { const c = CFG.combo; return Math.max(c.minStun, base - c.decay * Math.max(0, n - c.decayFrom + 1)); }

// Knocked down or getting up: always invulnerable (inv counts the frames left, see knockLeft).
const KNOCKED = {knock: 1, getup: 1, rollF: 1, rollB: 1};
// Actions with the crouching hurtbox height (and block while down is held: a crouching block, see isBlocking).
const CROUCHED = {crouch: 1, guardC: 1, cp: 1, ck: 1, chp: 1, chk: 1};

// A hit can touch F: not invulnerable, not knocked down, not KO'd, getting up or held in a throw, and a juggle still under combo.juggleMax hits.
function canBeHit(F) { return F.inv <= 0 && !KNOCKED[F.act] && F.act !== 'ko' && F.act !== 'thrown' && !(F.act === 'juggle' && F.juggle >= CFG.combo.juggleMax); }

// Hurtboxes in absolute mm, [body, head]: the body is ±body.hurt from the feet to the height minus body.headH,
// the head ±body.head from there to the height (body.h standing, hCrouch crouching or blocking with down held,
// hAir in the air).
function hurtBoxes(F) {
  const b = CFG.body, low = CROUCHED[F.act] || (F.act === 'block' && (F.prev & BTN.D));
  const top = F.y + (F.air ? b.hAir : low ? b.hCrouch : b.h), neck = top - b.headH;
  return [{x0: F.x - b.hurt, x1: F.x + b.hurt, y0: F.y, y1: neck}, {x0: F.x - b.head, x1: F.x + b.head, y0: neck, y1: top}];
}

// The box of move id in absolute mm, mirrored by the facing, while F is in that move's active frames; else null.
function moveBox(F, id) {
  const m = CFG.moves[id];
  if (!m || F.act !== id || F.af <= m.s || F.af > m.s + m.a) return null;
  const k = m.box, y0 = F.y + k[2], y1 = F.y + k[3];
  return F.face > 0 ? {x0: F.x + k[0], x1: F.x + k[1], y0, y1} : {x0: F.x - k[1], x1: F.x - k[0], y0, y1};
}

// Where A's move touches D, or null: the centre of the overlap of the move box with D's first hurtbox it
// overlaps (body, then head). Only a move in its active frames that has not touched yet, on a fighter that can be hit.
function touchPoint(A, D) {
  const box = A.hit ? null : moveBox(A, A.act);
  if (!box || !canBeHit(D)) return null;
  for (const h of hurtBoxes(D)) {
    const x0 = Math.max(box.x0, h.x0), x1 = Math.min(box.x1, h.x1), y0 = Math.max(box.y0, h.y0), y1 = Math.min(box.y1, h.y1);
    if (x0 < x1 && y0 < y1) return {x: (x0 + x1) >> 1, y: (y0 + y1) >> 1};
  }
  return null;
}

// States that can guard (with GUARD or back held at the moment of contact).
const GUARDING = {idle: 1, walkB: 1, crouch: 1, guard: 1, guardC: 1, block: 1};

// F blocks an attack of this height now: on the ground in a guarding state, holding GUARD or back, and for the
// height: mid either way, low only crouching (D held), high only standing. The held buttons are F.prev (this frame's).
function isBlocking(F, height) {
  if (!GUARDING[F.act] || F.air || !(F.prev & (BTN.GUARD | backBit(F)))) return false;
  const crouching = (F.prev & BTN.D) !== 0;
  return height === 'low' ? crouching : height === 'high' ? !crouching : true;
}

// End of the step: both fighters are checked before either hit lands, so two moves can trade on the same frame.
// Then the throws and the projectiles. Contacts resolve only in the 'fight' phase: after a KO or time-up the hp stays
// as it was when the round ended (a grab under way plays out without its damage). A held fighter whose thrower got
// hit meanwhile (a projectile can), or whose grab ended, is released.
function contactPhase(S, fs) {
  if (S.phase === 'fight') {
    const id0 = fs[0].act, id1 = fs[1].act, p0 = touchPoint(fs[0], fs[1]), p1 = touchPoint(fs[1], fs[0]);
    if (p0) fs[0].hit = resolveHit(S, fs[0], fs[1], CFG.moves[id0], id0, p0, fs[0].face);
    if (p1) fs[1].hit = resolveHit(S, fs[1], fs[0], CFG.moves[id1], id1, p1, fs[1].face);
    throwPhase(S, fs);
    projectilePhase(S, fs);
  }
  for (const D of fs) if (D.act === 'thrown' && !(fs[1 - D.side].act === 'thr' && fs[1 - D.side].hit)) setAct(D, 'idle');
}

// Move m (id in the events: a move, 'spec' or 'thr') of A touches D, pushing the way dir points. Returns 1 for a
// hit, 2 for a block (what A.hit holds). A blocked move (m.h set, see isBlocking) costs D m.chip, gives A
// meter.block of its damage, hitstops for the block class and leaves D in 'block' for m.bs frames. A hit: damage
// scaled by its number in the combo, meter to both, the hitstop of the move's class, the event at the contact
// point, then D's reaction. The projectile ('spec') has its own events and never sets A.hit (the caller does).
function resolveHit(S, A, D, m, id, pt, dir) {
  const proj = id === 'spec', max = CFG.body.meterMax;
  if (m.h && isBlocking(D, m.h)) {
    const chip = Math.min(D.hp, m.chip || 0);
    D.hp -= chip;
    A.meter = Math.min(max, A.meter + Math.floor(m.dmg * CFG.meter.block));
    S.stop = Math.max(S.stop, CFG.stop[m.stop === 'light' ? 'blockLight' : 'blockHeavy']);
    simEmit(S, proj ? 'projBlock' : 'block', A, {x: pt.x, y: pt.y, move: id, dmg: chip, heavy: m.stop === 'heavy'});
    setAct(D, 'block'); D.stun = m.bs;
    if (dir * D.x >= CFG.stage.half - CFG.body.push && !A.air) { D.vx = 0; A.vx = -dir * m.push; }
    else D.vx = dir * m.push;
    return 2;
  }
  const n = D.combo + 1, dmg = Math.floor(m.dmg * scaleFor(n) / 100);
  D.hp = Math.max(0, D.hp - dmg); D.combo = n; D.comboDmg += dmg;
  A.meter = Math.min(max, A.meter + Math.floor(dmg * CFG.meter.hit));
  D.meter = Math.min(max, D.meter + Math.floor(dmg * CFG.meter.taken));
  S.stop = Math.max(S.stop, CFG.stop[m.stop]);
  simEmit(S, proj ? 'projHit' : 'hit', A, {x: pt.x, y: pt.y, move: id, dmg, heavy: m.stop === 'heavy'});
  hitReaction(A, D, m, n, dir);
  return 1;
}

// A throw (act 'thr', see c2_moves.js) of fighter A: in its active frames it grabs D if the centres are within
// thr.range and D stands on the ground free of stun, not invulnerable and not already held ('thr' event: A plays
// the grab from af 1, D is 'thrown'); at af thr.hitF of the grab the throw hits through resolveHit (it has no height,
// so no block) and D is knocked down. Side 0 goes first, so it wins a grab on the same frame.
function throwPhase(S, fs) {
  const t = CFG.thr;
  for (const A of fs) {
    const D = fs[1 - A.side];
    if (A.act !== 'thr') continue;
    if (!A.hit) {
      if (A.af <= t.s || A.af > t.s + t.a || Math.abs(A.x - D.x) > t.range) continue;
      if (D.air || D.y > 0 || D.stun > 0 || !canBeHit(D)) continue;
      A.hit = 1; A.af = 1; A.vx = 0; D.vx = 0;
      setAct(D, 'thrown'); D.stun = 0;
      simEmit(S, 'thr', A, {x: D.x, y: D.y + CFG.spec.y});
    } else if (A.af === t.hitF) {
      resolveHit(S, A, D, t, 'thr', {x: D.x, y: D.y + CFG.spec.y}, A.face);
    }
  }
}

// Projectiles move at the start of a free step. Here, after the fighters' contacts: two that touch vanish together
// ('projClash'); one that touches the other side's fighter (hurtbox, one that can be hit) hits or is blocked through
// resolveHit and vanishes, and one beyond stage.half + 1000 vanishes too.
function projectilePhase(S, fs) {
  const k = CFG.spec, P = S.proj;
  if (P.length === 2 && Math.abs(P[0].x - P[1].x) <= 2 * k.box && Math.abs(P[0].y - P[1].y) <= 2 * k.box) {
    simEmit(S, 'projClash', fs[P[0].side], {x: (P[0].x + P[1].x) >> 1, y: P[0].y});
    P.length = 0;
    return;
  }
  const keep = [];
  for (const p of P) {
    const D = fs[1 - p.side], pt = canBeHit(D) ? projTouch(p, D) : null;
    if (pt) resolveHit(S, fs[p.side], D, k, 'spec', pt, p.vx > 0 ? 1 : -1);
    else if (Math.abs(p.x) <= CFG.stage.half + 1000) keep.push(p);
  }
  P.length = 0; for (const p of keep) P.push(p);
}

// Centre of the overlap of projectile p (a square of half-size spec.box) with D's first hurtbox it overlaps, or null.
function projTouch(p, D) {
  const b = CFG.spec.box;
  for (const h of hurtBoxes(D)) {
    const x0 = Math.max(p.x - b, h.x0), x1 = Math.min(p.x + b, h.x1), y0 = Math.max(p.y - b, h.y0), y1 = Math.min(p.y + b, h.y1);
    if (x0 < x1 && y0 < y1) return {x: (x0 + x1) >> 1, y: (y0 + y1) >> 1};
  }
  return null;
}

// D's reaction to the n-th hit of a combo, pushed toward dir (the way the attack or projectile goes):
// - knocked down (knock, or airKnock / spike on an airborne D): flies with the move's vx, vy, invulnerable;
// - launched (launch) or hit in the air: juggle, rising at least at the move's vy (else combo.lift), with the
//   move's vx (else its push); one more juggle hit;
// - else hitstun (hitstunFor) and a pushback of push that slides (groundSpeed); at the wall D stays and an
//   attacker on the ground slides back instead (a move without push, like the projectile, moves nobody).
function hitReaction(A, D, m, n, dir) {
  const down = m.knock ? m : D.air ? m.airKnock || (m.spike ? m : null) : null;
  D.stun = 0;
  if (down) {
    setAct(D, 'knock'); D.air = true; D.vx = down.vx ? dir * down.vx : 0; D.vy = down.vy; D.inv = CFG.knock.ground;
  } else if (m.launch || D.air) {
    const vx = m.vx !== undefined ? m.vx : m.push;
    setAct(D, 'juggle'); D.air = true; D.juggle++; D.vx = vx ? dir * vx : 0;
    D.vy = Math.max(D.vy, m.vy !== undefined ? m.vy : CFG.combo.lift);
  } else {
    setAct(D, 'hitStun'); D.stun = hitstunFor(m.hs, n);
    if (m.push && dir * D.x >= CFG.stage.half - CFG.body.push && !A.air) { D.vx = 0; A.vx = -dir * m.push; }
    else D.vx = dir * m.push;
  }
}

// Leaving hitstun or a knockdown: the combo against F is over.
function recoverFrom(F, act) { setAct(F, act); F.combo = 0; F.comboDmg = 0; F.juggle = 0; }

// At the end of a knockdown's ground time: a roll while a direction is held (forward or back for the facing), else a getup.
function wakeAct(F, bits) { return bits & fwdBit(F) ? 'rollF' : bits & backBit(F) ? 'rollB' : 'getup'; }

// Invulnerable frames left while knocked down or getting up: the whole ground time while still flying,
// then to the end of the current action.
function knockLeft(F) { return F.act === 'knock' && F.air ? CFG.knock.ground : actLength(F) - F.af + 1; }

// Roll speed on frame af (1..knock.roll): integer steps that add up to knock.rollDist.
function rollSpeed(af) { const k = CFG.knock; return Math.floor(k.rollDist * af / k.roll) - Math.floor(k.rollDist * (af - 1) / k.roll); }

// --- Rounds ---

// Round phases: 'intro' (round.intro frames, inputs ignored) -> 'fight' -> 'ko' | 'timeup' (inputs ignored, physics
// runs on and the actions under way run out, but no command, contact or projectile: the hp is the one of the frame
// the round ended) -> round.end frames later the round is scored -> next 'intro' or 'end'. In training there is no timer
// and no KO: hp stays at 1 or more and refills, once, when the fighter has been out of a combo (and not blocking)
// for training.refill frames.
function roundStep(S, fs) {
  const R = CFG.round, training = S.mode === 'training';
  if (training) trainingStep(S, fs);
  if (S.phase === 'intro') {
    if (S.pf === 0) simEmit(S, 'round', fs[0]);   // the HUD reads S.round
    if (++S.pf >= R.intro) { S.phase = 'fight'; S.pf = 0; simEmit(S, 'fight', fs[0]); }
  } else if (S.phase === 'fight') {
    S.pf++;
    if (fs[0].hp <= 0 || fs[1].hp <= 0) endRound(S, fs, 'ko');   // whatever the source (chip damage too)
    else if (S.timer > 0 && --S.timer === 0) endRound(S, fs, 'timeup');
  } else if (S.phase === 'end') {
    S.pf++;
  } else if (++S.pf >= R.end) scoreRound(S, fs);   // 'ko' or 'timeup'
}

function trainingStep(S, fs) {
  for (const F of fs) {
    F.hp = Math.max(1, F.hp);
    S.rf[F.side] = F.combo > 0 || F.act === 'block' ? 0 : Math.min(CFG.training.refill + 1, S.rf[F.side] + 1);
    if (S.rf[F.side] === CFG.training.refill) F.hp = CFG.body.hp;   // once, so a hp set by hand is not undone
  }
}

// The round is over: 'ko' (the fighters at 0 hp fall, the KO hitstop) or 'timeup'. Projectiles in flight vanish.
function endRound(S, fs, kind) {
  S.phase = kind; S.pf = 0; S.proj.length = 0;
  if (kind === 'timeup') { simEmit(S, 'timeup', fs[0]); return; }
  S.stop = CFG.stop.ko;
  for (const F of fs) {
    if (F.hp > 0) continue;
    setAct(F, 'ko'); F.stun = 0;
    if (!F.air) { F.air = true; F.vy = CFG.round.ko.vy; F.vx = (F.x < fs[1 - F.side].x ? -1 : 1) * CFG.round.ko.vx; }
    simEmit(S, 'ko', F);
  }
}

// More hp takes the round; equal hp gives it to both. Then the match ends (winner 0, 1 or 2 = both) or the next round starts.
function scoreRound(S, fs) {
  const d = fs[0].hp - fs[1].hp;
  if (d) { const w = d > 0 ? 0 : 1; S.wins[w]++; simEmit(S, 'win', fs[w]); }
  else { S.wins[0]++; S.wins[1]++; simEmit(S, 'draw', fs[0]); }
  const w0 = S.wins[0] >= CFG.round.wins, w1 = S.wins[1] >= CFG.round.wins;
  S.pf = 0;
  if (w0 || w1) { S.phase = 'end'; S.winner = w0 && w1 ? 2 : w0 ? 0 : 1; return; }
  for (const side of S.sides) { const old = side.team[side.cur]; side.team[side.cur] = Object.assign(newFighter(old.side, old.char), {meter: old.meter}); }
  S.round++; S.phase = 'intro'; S.stop = 0;
  S.timer = S.mode === 'training' ? -1 : CFG.round.timerS * 60;
}

// One frame. Input first: clean buttons and hold counters, then the 'charge' event. In hitstop (S.stop > 0) nothing
// else moves: only the buffer takes this frame's command (without expiring) and the input history updates.
// Otherwise: per fighter command and action (c2_moves.js), then the input history -> physics -> pushboxes, walls,
// max separation -> facing -> contacts (a hit sets the next hitstop). Then the round flow. frame++ either way.
// Commands are read only in the 'fight' phase (see actionStep).
function simStep(S, in0, in1) {
  S.ev.length = 0;
  const live = S.phase === 'fight';
  if (!live) { in0 = 0; in1 = 0; }   // intro, KO, time up and the end ignore the buttons
  const fs = [fighterOf(S, 0), fighterOf(S, 1)], bits = [inputPhase(fs[0], in0), inputPhase(fs[1], in1)];
  for (let i = 0; i < 2; i++) chargeEvent(S, fs[i], bits[i]);
  if (S.stop > 0) {
    S.stop--;
    for (let i = 0; i < 2; i++) { if (live) bufferCommand(S, fs[i], bits[i]); rememberInput(S, fs[i], bits[i]); }
  } else {
    for (const p of S.proj) p.x += p.vx;
    for (let i = 0; i < 2; i++) { actionStep(S, fs[i], bits[i]); rememberInput(S, fs[i], bits[i]); }
    const x0 = [fs[0].x, fs[1].x];
    for (const f of fs) fighterPhysics(S, f);
    pushApart(fs[0], fs[1], x0);
    faceOpponent(fs[0], fs[1]); faceOpponent(fs[1], fs[0]);
    contactPhase(S, fs);
  }
  roundStep(S, fs);
  S.frame++;
}

// Key poses of the placeholder fighters (data for e_fighter3d.js, which resolves, blends and solves them).
// A pose: {joint: [x, y, z] degrees (Euler XYZ in the parent joint's frame), pos: [x, y, z] pelvis offset (m)}, and
// optionally fL / fR: an ankle target (model space, m; 0.08 up = standing) that the leg reaches by IK. Signs:
// pelvis/spine/chest/neck/head x+ = bend forward, y+ = turn the right shoulder forward, z+ = lean right; shoulder x- =
// arm forward, shL z+ / shR z- = arm out; elbow x- = bend; hip x- = leg forward, knee x+ = bend; ankle x+ = toes down.
// Key poses (b = based on another key; a key that sets a leg's angles drops the inherited target of that leg).
const F3_KEY = {
  // Fighting stance, left side forward: lead fist high, rear fist at the chin, knees soft.
  stance: {pos: [0, -.07, 0], fL: [.11, .08, .21], fR: [-.13, .08, -.2], pelvis: [0, -4, 0], spine: [6, -2, 0], chest: [4, -4, 0],
    neck: [0, 6, 0], head: [-8, 10, 0], shL: [-55, -10, 15], elL: [-105, 0, 0], shR: [-30, 10, -20], elR: [-130, 0, 0]},
  // Walks sit a little lower than the stance, so every step stays within the legs' reach (the feet never slide).
  walkF: {b: 'stance', pos: [0, -.1, 0]},
  walkB: {b: 'stance', pos: [0, -.1, 0], pelvis: [-4, -4, 0], spine: [2, -2, 0], head: [-4, 10, 0], shL: [-62, -14, 14], elL: [-112, 0, 0]},
  // Guard: lower, forearms up in front of the face.
  guard: {b: 'stance', pos: [0, -.14, -.03], spine: [14, -4, 0], chest: [10, -6, 0], head: [-6, 8, 0],
    shL: [-88, -10, -4], elL: [-128, 0, 0], shR: [-80, 10, 6], elR: [-132, 0, 0]},
  // Block: the guard pushed back; blockHitC is the crouching block (down held).
  blockHit: {b: 'guard', pos: [0, -.13, -.09], pelvis: [-6, -8, 0], spine: [2, -4, 0], head: [-20, 8, 0]},
  blockHitC: {b: 'guardC', pos: [0, -.62, -.05], pelvis: [13, -8, 0], spine: [14, -4, 0], head: [-24, 8, 0]},
  // Crouch: low (the crouching hurtbox is 1.05 m), leaning in, the head up to watch the opponent.
  crouch: {pos: [0, -.6, .02], fL: [.13, .08, .34], fR: [-.15, .08, -.13], pelvis: [15, -8, 0], spine: [16, -4, 0], chest: [12, -8, 0],
    neck: [-10, 6, 0], head: [-26, 10, 0], shL: [-90, -10, 15], elL: [-100, 0, 0], shR: [-70, 10, -20], elR: [-125, 0, 0]},
  guardC: {b: 'crouch', head: [-16, 8, 0], shL: [-112, -10, -4], elL: [-128, 0, 0], shR: [-104, 10, 6], elR: [-132, 0, 0]},

// The outline shell's push per vertex: the mean of the distinct normals found at that position, lengthened so every
// face moves out by the full width (so box edges and cylinder rims stay closed); at most twice, on sharp tips.
function f3OutlineGeo(g) {
  const p = g.attributes.position, nr = g.attributes.normal, at = new Map(), out = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const key = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
    if (!at.has(key)) at.set(key, []);
    at.get(key).push(i);
  }
  for (const ids of at.values()) {
    const ns = [], a = new THREE.Vector3();
    for (const i of ids) { const n = new THREE.Vector3().fromBufferAttribute(nr, i); if (!ns.some(u => u.dot(n) > .999)) ns.push(n); }
    for (const n of ns) a.add(n);
    if (a.lengthSq() < 1e-8) a.copy(ns[0]); else a.normalize();
    let lo = 1;
    for (const n of ns) lo = Math.min(lo, a.dot(n));
    a.multiplyScalar(1 / Math.max(.5, lo));
    for (const i of ids) out.set([a.x, a.y, a.z], i * 3);
  }
  const o = new THREE.BufferGeometry();
  o.setAttribute('position', p); o.setAttribute('aOut', new THREE.BufferAttribute(out, 3)); o.setIndex(g.index);
  g.computeBoundingSphere(); o.boundingSphere = g.boundingSphere.clone(); o.boundingSphere.radius += 2 * F3_OUTLINE.w;
  return o;
}

// The shared gradient (3 bands), outline material and shapes, once.
function f3Shared() {
  if (F3.grad) return;
  const d = new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]);
  F3.grad = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  F3.grad.minFilter = F3.grad.magFilter = THREE.NearestFilter; F3.grad.generateMipmaps = false; F3.grad.needsUpdate = true;
  F3.outMat = new THREE.ShaderMaterial({side: THREE.BackSide,
    uniforms: {uW: {value: F3_OUTLINE.w}, uColor: {value: new THREE.Color(F3_OUTLINE.color)}},
    vertexShader: 'attribute vec3 aOut;\nuniform float uW;\nvoid main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + aOut * uW, 1.); }',
    fragmentShader: 'uniform vec3 uColor;\nvoid main(){ gl_FragColor = vec4(uColor, 1.); }'});
  for (const k in F3_SHAPE) { const g = F3_SHAPE[k](); F3.geo[k] = g; F3.out.set(g, f3OutlineGeo(g)); }
}

// The fighters' light: a warm sun from the upper left (as in the painting, and a little in front) and a sky/stone fill.
function f3Lights() {
  const sun = new THREE.DirectionalLight(0xfff2dc, .75);
  sun.position.set(-4, 6, 5);
  return [sun, new THREE.HemisphereLight(0xdcecff, 0x6b5a4a, .5)];
}

// One fighter ('ren' | 'kael'): joints, toon parts with outlines, limb points and its own materials (so effects can
// flash one fighter). Not yet in the scene.
function fighterBuild(char) {
  f3Shared();
  const col = F3_COL[char], mats = {}, joints = {}, limbs = {}, root = new THREE.Group();
  for (const k in col) mats[k] = new THREE.MeshToonMaterial({color: col[k], gradientMap: F3.grad});
  for (const j of F3_J) { const b = F3_BONE[j], g = new THREE.Group(); g.position.set(b[1], b[2], b[3]); joints[j] = g; (b[0] ? joints[b[0]] : root).add(g); }
  for (const [j, slot, shape] of F3_PART) {
    const g = F3.geo[shape === 'hair' ? 'hair_' + char : shape], mesh = new THREE.Mesh(g, mats[slot]);
    mesh.name = j + '.' + shape;
    mesh.add(new THREE.Mesh(F3.out.get(g), F3.outMat));
    joints[j].add(mesh);
  }
  for (const l in F3_LIMB) { const b = F3_LIMB[l], o = new THREE.Object3D(); o.position.set(b[1], b[2], b[3]); joints[b[0]].add(o); limbs[l] = o; }
  return {root, joints, limbs, mats};
}

// Every drawn frame: each side's fighter at its sim position (feet at F.x, F.y; side 0 in front), facing and pose.
// S null (no match): hidden. Render-side smoothing: when the action changes to a free or movement one (F3_EASE), the
// pose eases from the last drawn one into the new action's over its first CFG.anim.blend frames (by F.af, so it
// follows the sim). Strikes, hits and throws snap: a strike shows exactly on its first active frame.
const F3_EASE = {idle: 1, walkF: 1, walkB: 1, crouch: 1, guard: 1, guardC: 1, jumpSquat: 1, air: 1, dashF: 1, dashB: 1, win: 1};
function f3Sync(S) {
  for (let i = 0; i < F3D.length; i++) {
    const it = F3D[i];
    if (it.kind === 'model') { mdSync(it, i, S); continue; }   // a Meshy fighter (e_model.js)
    it.root.visible = !!S;
    if (!S) { it.F = null; continue; }
    const F = fighterOf(S, i), n = CFG.anim.blend;
    it.root.position.set(F.x / 1000, F.y / 1000, i ? -.05 : .05);
    it.root.rotation.y = F.face * F3_YAW;
    let p = f3Raw(F, S);
    if (F !== it.F) it.from = null;   // a new fighter (new match or round): nothing to ease from
    else if (F.act !== it.act) it.from = F3_EASE[F.act] ? it.pose : null;
    if (it.from && F.af < n) p = f3Mix(it.from, p, Math.max(0, F.af) / n);
    it.F = F; it.act = F.act; it.pose = p;   // the drawn pose, legs solved below, ankle targets kept for the next ease
    f3Apply(it, f3Solve(p));
  }
}

function f3Apply(it, p) {
  const J = it.joints, D = F3_DEG, b = F3_BONE.pelvis;
  for (const j of F3_J) { const r = p[j]; J[j].rotation.set(r[0] * D, r[1] * D, r[2] * D); }
  J.pelvis.position.set(b[1] + p.pos[0], b[2] + p.pos[1], b[3] + p.pos[2]);
}

// World position (metres) of a limb point of side's fighter, as last posed.
function limbWorld(side, limb) { return F3D[side].limbs[limb].getWorldPosition(new THREE.Vector3()); }

// --- Poses --- (the key-pose table F3_KEY and the cosmetic timings are in e_poses.js)
function f3Lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function f3Smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

// A key pose, resolved once (every joint, legs with a target solved).
function f3Key(name) {
  if (F3.memo[name]) return F3.memo[name];
  const k = F3_KEY[name], base = k.b ? f3Key(k.b) : null, p = {};
  for (const j of F3_J) p[j] = (k[j] || (base ? base[j] : [0, 0, 0])).slice();
  p.pos = (k.pos || (base ? base.pos : [0, 0, 0])).slice();
  [['fL', 'hipL', 'knL', 'anL'], ['fR', 'hipR', 'knR', 'anR']].forEach(([f, h, kn, an], side) => {
    const t = k[f] || (!k[h] && !k[kn] && !k[an] && base && base[f]);
    if (t) { p[f] = t.slice(); f3Leg(p, side, p[f]); }
  });
  return F3.memo[name] = p;
}

// The pose between a and b (t from 0 to 1); ankle targets blend when both poses have one.
function f3Mix(a, b, t) {
  const o = {pos: f3Lerp3(a.pos, b.pos, t)};
  for (const j of F3_J) o[j] = f3Lerp3(a[j], b[j], t);
  if (a.fL && b.fL) o.fL = f3Lerp3(a.fL, b.fL, t);
  if (a.fR && b.fR) o.fR = f3Lerp3(a.fR, b.fR, t);
  return o;
}

// Two-bone IK for one leg (side 0 left, 1 right): hip flexion and abduction and knee bend so the ankle reaches t
// (model space), then the ankle undoes the chain so the sole is level and turned with the pelvis.
function f3Leg(p, side, t) {
  const B = F3_BONE, h = side ? B.hipR : B.hipL, L1 = -B.knL[2], L2 = -B.anL[2], D = F3_DEG, v = F3.v, m = F3.m, m2 = F3.m2, e = F3.e;
  const P = p.pelvis, pel = F3.m3.makeRotationFromEuler(e.set(P[0] * D, P[1] * D, P[2] * D));
  // The target from the hip, in the pelvis frame.
  v.set(h[1], h[2], h[3]).applyMatrix4(pel);
  v.set(t[0] - B.pelvis[1] - p.pos[0] - v.x, t[1] - B.pelvis[2] - p.pos[1] - v.y, t[2] - B.pelvis[3] - p.pos[2] - v.z);
  v.applyMatrix4(m.copy(pel).transpose());
  const len = v.length(), d = Math.min(L1 + L2 - 1e-4, Math.max(.05, len));
  v.multiplyScalar(d / len);
  // Knee bend from the distance; the bent leg (ankle at (0, vy, vz) in the hip frame) turned onto the target:
  // abduction g about z, then flexion a about x.
  const cosK = Math.max(-1, Math.min(1, (d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2))), k = Math.acos(cosK);
  const vy = -L1 - L2 * cosK, vz = -L2 * Math.sin(k), g = Math.asin(Math.max(-1, Math.min(1, -v.x / vy)));
  let a = Math.atan2(v.z, v.y) - Math.atan2(vz, vy * Math.cos(g));
  a = Math.atan2(Math.sin(a), Math.cos(a));
  p[side ? 'hipR' : 'hipL'] = [a / D, 0, g / D]; p[side ? 'knR' : 'knL'] = [k / D, 0, 0];
  // Ankle = (pelvis * hip * knee)^-1 * (the pelvis's turn): the sole level, pointing where the hips point.
  m.copy(pel).multiply(m2.makeRotationFromEuler(e.set(a, 0, g))).multiply(m2.makeRotationX(k)).transpose();
  e.setFromRotationMatrix(m.multiply(m2.makeRotationY(P[1] * D)));
  p[side ? 'anR' : 'anL'] = [e.x / D, e.y / D, e.z / D];
}

// Legs with a target solved, then only the joints and pos (a fresh object).
function f3Solve(p) {
  if (p.fL) f3Leg(p, 0, p.fL);
  if (p.fR) f3Leg(p, 1, p.fR);
  const o = {pos: p.pos};
  for (const j of F3_J) o[j] = p[j];
  return o;
}

// The pose of fighter F now: a pure function of F.act, F.af, F.x and F.face (walk), F.air, F.vy, F.hit (throw),
// F.stun (hit and block recovery), F.prev (a block with down held is crouched), F.land (landing) and S.frame (breathing).
function poseOf(F, S) { return f3Solve(f3Raw(F, S)); }
// The same before the legs are solved (ankle targets kept, for blending). Crouched on the ground (the sim's crouching
// hurtbox: crouch, guardC, the crouching moves, a block with down held) the head stays within F3_HEADROOM of the
// hurtbox's top: if a pose would raise it higher, the pelvis drops by the difference (the planted feet follow by IK).
const F3_HEADROOM = .1;
function f3Raw(F, S) {
  const m = CFG.moves[F.act], p = m ? f3Move(F, m) : f3Act(F, S);
  if (F.air) return p;
  const top = (hurtBoxes(F)[1].y1 - F.y) / 1000;
  if (top < CFG.body.h / 1000) {
    const over = f3Point(p, F3_HEAD, 0, .11, .01)[1] + F3_HEAD_R - top - F3_HEADROOM;
    if (over > 0) p.pos = [p.pos[0], p.pos[1] - over, p.pos[2]];
  }
  return p;
}

// Moves follow their frame data: from the posture to the wind-up by the end of startup, the strike held through the
// active frames, back to the posture by the end of recovery; kicks fold back through the wind-up (the chamber) first.
// Air moves hold a recovery pose until landing: kicks the chamber, punches most of the way back to the air pose.
function f3Move(F, m) {
  const id = F.act, af = F.af, air = m.r === 'land', from = air ? f3Air(F) : f3Key(F3_FROM[id] || 'stance');
  const W = F3_KEY[id + 'W'] ? f3Key(id + 'W') : from, H = F3_KEY[id + 'H'] ? f3Key(id + 'H') : from;
  if (af <= m.s) return f3Mix(from, W, f3Smooth(af / m.s));
  if (af <= m.s + m.a) return f3Mix(H, H, 0);
  const kick = m.limb[0] === 'f', since = af - m.s - m.a;
  if (air) return kick ? f3Mix(H, W, f3Smooth(since / 8)) : f3Mix(H, from, .6 * f3Smooth(since / 8));
  const t = since / m.r;
  if (kick) return t < .5 ? f3Mix(H, W, f3Smooth(2 * t)) : f3Mix(W, from, f3Smooth(2 * t - 1));
  return f3Mix(H, from, f3Smooth(t));
}

// The air pose: tucked while rising, legs reaching down while falling.
function f3Air(F) { return f3Mix(f3Key('airUp'), f3Key('airDown'), f3Smooth((CFG.jump.v - F.vy) / (2 * CFG.jump.v))); }

function f3Act(F, S) {
  const K = f3Key, af = F.af, st = K('stance');
  switch (F.act) {
    case 'walkF': case 'walkB': return f3Walk(F);
    case 'crouch': case 'guard': case 'guardC': return f3Breathe(f3Mix(K(F.act), K(F.act), 0), S);
    case 'jumpSquat': return f3Mix(K('squat'), K('squat'), 0);
    case 'landing': return f3Mix(K('squat'), st, f3Smooth(af / Math.max(1, F.land)));
    case 'air': return f3Air(F);
    case 'dashF': case 'dashB': return f3Mix(K(F.act), K(F.act), 0);
    // Block and hit snap into their recoil on the contact frame (it holds through the hitstop), then ease back to the
    // guard / the stance as the stun runs out. A block with down held is the crouching block (as in the sim).
    case 'block': {
      const low = F.prev & BTN.D;
      return f3Mix(K(low ? 'guardC' : 'guard'), K(low ? 'blockHitC' : 'blockHit'), f3Smooth(F.stun / 6));
    }
    case 'hitStun': return f3Mix(st, K('hurt'), f3Smooth(F.stun / 8));
    case 'juggle': case 'knock': case 'ko': {   // flying (tilting back as it falls), then lying on the floor
      if (F.air) return f3Mix(K('flyUp'), K('flyDown'), f3Smooth((60 - F.vy) / 140));
      const down = K(F.act === 'ko' ? 'koDown' : 'down');
      return f3Mix(down, down, 0);
    }
    case 'getup': return af < 5 ? f3Mix(K('down'), K('sit'), f3Smooth(af / 5)) : af < 10 ? f3Mix(K('sit'), K('kneel'), f3Smooth((af - 5) / 5))
      : f3Mix(K('kneel'), st, f3Smooth((af - 10) / 6));
    case 'rollF': case 'rollB': return f3Roll(F);
    case 'thr': return f3Throw(F);
    case 'thrWhiff': return f3Mix(K('reach'), st, f3Smooth((af - 4) / 18));
    case 'thrown': return f3Mix(K('held'), K('held'), 0);
    case 'spec': return f3Spec(af);
    case 'win': return f3Breathe(f3Mix(K('win'), K('win'), 0), S);
    case 'intro': return f3Breathe(f3Mix(K('intro'), K('intro'), 0), S);
    default: return f3Breathe(f3Mix(st, st, 0), S);   // idle
  }
}

// Breathing on the free stances: the chest and shoulders rise and fall (the IK keeps the feet planted).
function f3Breathe(p, S) {
  const B = F3_BREATH, b = Math.sin(S.frame * B.rate);
  p.chest[0] += B.chest * b; p.pos[1] += B.rise * b; p.shL[2] += B.chest * b; p.shR[2] -= B.chest * b;
  return p;
}

// Walk: the stance's feet step along the walking line (the world x axis seen from the model) by distance, F.x * face:
// each foot is planted for half a stride, moving back under the body exactly as far as the body moves, then swings.
function f3Walk(F) {
  const W = F3_WALK, k = f3Smooth(F.af / W.fade), p = f3Mix(f3Key('stance'), f3Key(F.act), k);
  const ph = F.x * F.face / 1000 / W.stride, wx = F.face * Math.cos(F3_YAW), wz = Math.sin(F3_YAW), D = W.stride / 2;
  [['fL', 0], ['fR', .5]].forEach(([f, o]) => {
    const u = ((ph + o) % 1 + 1) % 1, sw = u >= .5, s = sw ? D * (2 * u - 1.5) : D * (.5 - 2 * u);
    const t = p[f], lift = sw ? W.lift * Math.sin(Math.PI * (2 * u - 1)) : 0;
    p[f] = [t[0] + wx * s * k, t[1] + lift * k, t[2] + wz * s * k];
  });
  return p;
}

// Rolls: lying on the back the body tucks into a ball, which then tumbles (450° forward, 270° back: both end upright)
// about its own centre, opens into the crouch (the feet go straight down to the floor: IK from where the ball's feet
// are) and rises into the stance; F3_TUCK (e_poses.js) is the ball's centre and radius.
function f3Roll(F) {
  const t = F.af / CFG.knock.roll, spin = F.act === 'rollF' ? 450 : -270, cr = f3Key('crouch');
  if (t >= .8) return f3Mix(cr, f3Key('stance'), f3Smooth((t - .8) / .2));
  const a = -90 + spin * f3Smooth((t - .15) / .6), r = a * F3_DEG, c = F3_TUCK, p = f3Mix(f3Key('down'), f3Key('tuck'), f3Smooth(t / .2));
  const y = c.r - F3_BONE.pelvis[2] - (c.y * Math.cos(r) - c.z * Math.sin(r)), z = -(c.y * Math.sin(r) + c.z * Math.cos(r));
  p.pelvis[0] = a; p.pos = f3Lerp3(f3Key('down').pos, [0, y, z], f3Smooth(t / .2));
  if (t < .65) return p;
  const end = f3Mix(cr, cr, 0);
  end.pelvis[0] += spin - 90;   // the crouch's pitch, after the whole turn
  p.fL = f3Ankle(p, 0); p.fR = f3Ankle(p, 1);
  return f3Mix(p, end, f3Smooth((t - .65) / .15));
}

// Model-space position of point (x, y, z) of the last joint of chain (root first) in pose p: forward kinematics, as
// the rig computes it. F3_HEAD = the chain to the head; F3_HEAD_R = the head sphere's largest radius (its centre is at
// (0, .11, .01) in the head frame, see the head shape).
const F3_HEAD = ['pelvis', 'spine', 'chest', 'neck', 'head'], F3_HEAD_R = .1155;
function f3Point(p, chain, x, y, z) {
  const v = F3.v.set(x, y, z), D = F3_DEG;
  for (let i = chain.length - 1; i >= 0; i--) {
    const j = chain[i], r = p[j], b = F3_BONE[j], o = j === 'pelvis' ? p.pos : [0, 0, 0];
    v.applyMatrix4(F3.m.makeRotationFromEuler(F3.e.set(r[0] * D, r[1] * D, r[2] * D)));
    v.set(v.x + b[1] + o[0], v.y + b[2] + o[1], v.z + b[3] + o[2]);
  }
  return [v.x, v.y, v.z];
}
function f3Ankle(p, side) { return f3Point(p, side ? ['pelvis', 'hipR', 'knR', 'anR'] : ['pelvis', 'hipL', 'knL', 'anL'], 0, 0, 0); }

// Throw: the reach on the attempt (a miss goes on in thrWhiff); after a grab (F.hit, af from 1 again) hold, pull back
// and shove at thr.hitF, the frame the throw hits, then back to the stance.
function f3Throw(F) {
  const K = f3Key, af = F.af, t = CFG.thr;
  if (!F.hit) return f3Mix(K('stance'), K('reach'), f3Smooth(af / t.s));
  if (af <= t.hitF - 8) return f3Mix(K('reach'), K('clinch'), f3Smooth(af / 6));
  if (af < t.hitF) return f3Mix(K('clinch'), K('tossW'), f3Smooth((af - t.hitF + 8) / 6));
  return f3Mix(K('toss'), K('stance'), f3Smooth((af - t.hitF - 2) / (t.anim - t.hitF - 2)));
}

// Special: charge until 2 frames before the shot, thrust on the spawn frame, hold, then back to the stance.
function f3Spec(af) {
  const K = f3Key, n = CFG.spec.spawn, r = CFG.spec.rec;
  if (af <= n - 2) return f3Mix(K('stance'), K('specW'), f3Smooth(af / (n - 2)));
  if (af <= n) return f3Mix(K('specW'), K('specH'), f3Smooth((af - n + 2) / 2));
  return f3Mix(K('specH'), K('stance'), f3Smooth((af - n - 10) / (r - 10)));
}

// The Meshy fighters (Tappa 2a): a character packed by tools/meshy_pack.py (ASSETS '<key>/<key>.json', '.bin', '.jpg'),
// drawn as a toon SkinnedMesh with a skinned outline. Its pose is a pure function of the sim state (mdPoseOf), put on the
// bones on every drawn frame (mdSync, called by f3Sync for the items of kind 'model'). Graphics only: it reads the
// state and never writes it. Model space as the placeholder's: metres, the feet at y=0, forward +z.

const MD = {};   // decoded packages by key (see mdData)
const MD_OUTLINE = .012;   // outline width, metres in the world

// The decoded package of key: {meta, nb, bones, index (bone name -> index), geo, clips: {id: {n, fps, q, h}}}, or null
// when ASSETS has no such package. Memoised per meta object (a package swapped in ASSETS is decoded again).
function mdData(key) {
  const meta = ASSETS[key + '/' + key + '.json'], b64 = ASSETS[key + '/' + key + '.bin'];
  if (!meta || !b64) return null;

    if (!te) continue;
    const limb = e.limb || m.limb, k = m.box, F = {face: 1, x: 0, af: 0, side: 0}, c = {F, S: {frame: 0}, m, id};
    let best = null;
    for (let t = te.t[0]; t <= te.t[1] + 1e-6; t += 1 / 30) {
      let worst = 0, reach = 0;
      for (const face of [1, -1]) {
        F.face = face; c.force = t; at(mdEval(md, e, c), face); it.limbs[limb].getWorldPosition(v);
        const x = v.x * face * 1000, y = v.y * 1000;
        worst = Math.max(worst, Math.hypot(Math.max(k[0] - x, 0, x - k[1]), Math.max(k[2] - y, 0, y - k[3]))); reach += x;
      }
      if (!best || worst < best.w - 1e-6 || (Math.abs(worst - best.w) <= 1e-6 && reach > best.r)) best = {t, w: worst, r: reach};
    }
    md.hitT[id] = best.t;
  }
  at(mdRest(md), 0);
}

const MD_QA = new THREE.Quaternion(), MD_QB = new THREE.Quaternion(), MD_Q1 = new THREE.Quaternion(), MD_CURL = 5;
// Clip id of md at t seconds: rotations slerped between the two nearest frames, the Hips' position lerped. Clamped to
// the clip, or wrapped over its length when loop is set (the first and last frames of a cycle are the same pose).
function mdSample(md, id, t, loop) {
  const c = md.clips[id], nb = md.nb, last = c.n - 1, q = new Float32Array(nb * 4), h = new Float32Array(3);
  let f = t * c.fps;
  f = loop ? ((f % last) + last) % last : Math.max(0, Math.min(last, f));
  const i = Math.min(last - 1, Math.floor(f)), k = f - i, a = i * nb * 4, b = a + nb * 4;
  for (let j = 0; j < nb * 4; j += 4) MD_QA.fromArray(c.q, a + j).slerp(MD_QB.fromArray(c.q, b + j), k).toArray(q, j);
  for (let j = 0; j < 3; j++) h[j] = c.h[i * 3 + j] + (c.h[i * 3 + 3 + j] - c.h[i * 3 + j]) * k;
  return {q, h};
}

// a and b blended: k = 0 is a, 1 is b (slerp per bone, lerp of the Hips).
function mdMix(a, b, k) {
  const q = new Float32Array(a.q.length), h = new Float32Array(3);
  for (let i = 0; i < q.length; i += 4) {
    MD_QA.fromArray(a.q, i).slerp(MD_QB.fromArray(b.q, i), k).toArray(q, i);
  }
  for (let i = 0; i < 3; i++) h[i] = a.h[i] + (b.h[i] - a.h[i]) * k;
  return {q, h};
}

function mdApply(it, p) {
  const bs = it.bones;
  for (let i = 0; i < bs.length; i++) bs[i].quaternion.fromArray(p.q, i * 4);
  bs[0].position.fromArray(p.h);
}

// Every drawn frame, for side's Meshy fighter: as f3Sync does for the placeholders (visible, at F.x, F.y, turned
// face * F3_YAW, and mirrored when facing left), a change to a free or movement act eased in over CFG.anim.model frames by F.af, a strike over its
// first CFG.anim.strikeIn frames (never into its active frames: there the pose is the clip's). Hits and throws snap.
function mdSync(it, side, S) {
  it.root.visible = !!S;
  if (!S) { it.F = null; return; }
  const F = fighterOf(S, side), m = CFG.moves[F.act], n = m ? Math.min(CFG.anim.strikeIn, m.s - 1) : CFG.anim.model;
  it.root.position.set(F.x / 1000, F.y / 1000, side ? -.05 : .05);
  it.root.rotation.y = F.face * F3_YAW;
  it.body.scale.x = it.scale * F.face;   // facing left: the mirror image (fx's squash scales the root, not the body)
  if (it.fingers) {   // fists, opened where the act opens the hands: closing and opening in MD_CURL frames
    const k = CFG.looks[it.key].openHands.includes(F.act) ? 0 : 1;
    if (F !== it.F || F.act !== it.act) it.curl0 = F === it.F ? it.curl : k;
    it.curl = it.curl0 + (k - it.curl0) * Math.min(1, Math.max(0, F.af) / MD_CURL);
    for (let i = 0; i < it.fingers.length; i++) it.fingers[i].quaternion.copy(MD_Q1).slerp(it.fist[i], it.curl);
  }
  let p = mdPoseOf(F, S) || mdRest(mdData(it.key));
  if (F !== it.F) it.from = null;
  else if (F.act !== it.act) it.from = F3_EASE[F.act] || (m && n > 0) ? it.pose : null;
  if (it.from && F.af < n) p = mdMix(it.from, p, Math.max(0, F.af) / n);
  it.F = F; it.act = F.act; it.pose = p;
  mdApply(it, p);
  if (it.sash) mdSash(it, S);
}

// World y (m) of the top of side's head: the head's end bone of a model, the highest vertex of a placeholder's head.
function headTop(side) {
  const it = F3D[side];
  if (it.kind === 'model') { it.root.updateMatrixWorld(true); return it.headEnd.getWorldPosition(new THREE.Vector3()).y; }
  const h = it.joints.head.children.find(o => o.name === 'head.head'), a = h.geometry.attributes.position, v = new THREE.Vector3();
  let y = -1e9;
  h.updateWorldMatrix(true, false);
  for (let k = 0; k < a.count; k++) y = Math.max(y, v.fromBufferAttribute(a, k).applyMatrix4(h.matrixWorld).y);
  return y;
}

// Character viewer ("Anteprima 3D", 7/11/2026): one Meshy fighter alone on a stage, turned by drag, pinch and wheel,
// playing the game's own animation: a stand-alone fighter state stepped 60 times a second and drawn by mdSync, so what
// shows here is exactly what the game draws for that act and frame. A separate page (viewer.html, built by mk.sh).

const VW = {it: null, F: null, S: null, renderer: null, scene: null, camera: null, shadow: null, plan: [], step: 0, left: 0,
  name: '', speed: 1, acc: 0, last: null, yaw: .55, zoom: 1, fit: 5.4, spin: true, idleMs: 0, pointers: new Map(), pinch: 0, tex: {}, mats: {}};
const VW_DT = 1000 / 60, VW_YAW = .55, VW_TALL = 2.15, VW_WIDE = 2.1;   // metres that fit above the controls, and across
const VW_PACE = .85;   // the viewer plays 15% slower than the game (Denis, 7/11: "il pg è troppo veloce", only here)
// What each button plays: a list of steps [act, frames, mode]; a move id alone takes its frame data from CFG.moves.
// Modes: 'jump' (take-off at the jump speed, falls with gravity until the floor), 'jumpAtk' (the same, the air kick
// starting 8 frames in), 'fly' (knocked up, flies until the floor), 'walkF'/'walkB'/'dash' (walks the fighter state).
const VW_PLAYS = [
  ['Guardia', [['idle', 150], ['guard', 60], ['crouch', 60], ['guardC', 60]]],
  ['Cammina', [['walkF', 110, 'walkF'], ['walkB', 110, 'walkB'], ['dashF', CFG.dash.f.n, 'dash'], ['dashB', CFG.dash.b.n, 'dash']]],
  ['Pugni', ['p1', 'p2', 'p3', 'hp']],
  ['Calci', ['k1', 'k2', 'hk']],
  ['In basso', ['cp', 'ck', 'chp', 'chk']],
  ['Salto', [['jumpSquat', CFG.jump.squat], ['air', 0, 'jump'], ['landing', CFG.jump.land + 6], ['jumpSquat', CFG.jump.squat], ['jk', 0, 'jumpAtk'], ['landing', CFG.jump.landAtk + 6]]],
  ['Speciale', ['spec']],
  ['Presa', [['thr', CFG.thr.s + CFG.thr.a], ['thrHit', CFG.thr.anim]]],
  ['Colpito', [['hitStun', 24], ['block', 16]]],
  ['A terra', [['knock', 0, 'fly'], ['knock', CFG.knock.ground], ['getup', CFG.knock.getup]]],
];
const VW_NAMES = {idle: 'Guardia', guard: 'Parata', crouch: 'Accovacciato', guardC: 'Parata bassa', walkF: 'Cammina avanti',
  walkB: 'Cammina indietro', dashF: 'Scatto avanti', dashB: 'Scatto indietro', p1: 'Pugno 1', p2: 'Pugno 2', p3: 'Pugno 3',
  hp: 'Pugno forte', k1: 'Calcio 1', k2: 'Calcio 2', hk: 'Calcio forte', cp: 'Pugno basso', ck: 'Calcio basso',
  chp: 'Montante', chk: 'Calcio lanciante', jumpSquat: 'Salto', air: 'In volo', landing: 'Atterraggio', jk: 'Calcio in volo',
  spec: 'Colpo energetico', thr: 'Presa', thrHit: 'Lancio', hitStun: 'Colpito', block: 'Para il colpo', knock: 'A terra',
  getup: 'Si rialza'};

function vwBoot() {
  // The proposal Denis is judging (7/11/2026): guard A (the boxing guard the punches start from, breathing), fists
  // (open only in the special and the throw) and the head held a little higher.
  const guard = {c: 'a191', at: 0, breathe: 1};
  Object.assign(CFG.looks.ren, {fists: true, headUp: 12, spikes: true, faceLine: true, line: {w: .007, back: .02}, flatFace: true, sash: true, faceShape: true, head: true, smoothNormals: true,
    clips: {idle: guard, intro: guard, crouch: {low: {c: 'a54', at: .67}, up: guard}}});   // (the paint: the viewer's own buttons, vwPaint)
  const it = modelBuild('ren');
  if (!it) { document.getElementById('now').textContent = 'Il modello di Ren non è nel pacchetto.'; return; }
  const cv = document.getElementById('view');
  VW.renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true});
  VW.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  VW.scene = new THREE.Scene(); VW.camera = new THREE.PerspectiveCamera(30, 1, .1, 50);
  VW.scene.add(...f3Lights(), it.root, vwShadow());
  VW.it = it; VW.F = {side: 0, char: 'ren', x: 0, y: 0, vx: 0, vy: 0, face: 1, act: 'idle', af: 0, air: false, hit: 0, stun: 0, prev: 0, land: CFG.jump.land, hold: [0, 0]};
  VW.S = {frame: 0, sides: [{team: [VW.F], cur: 0}]};
  // the two paints: the drawing projected on the model (tools/paint_from_drawing.py) and Meshy's own
  VW.tex.meshy = it.mats.main.map;
  const img = new Image(), t = new THREE.Texture(img); t.flipY = false;
  img.src = ASSETS['ren/ren_painted.jpg'] || ASSETS['ren/ren.jpg']; img.decode().then(() => { t.needsUpdate = true; }, () => {});
  VW.tex.draw = t;
  VW.mats.toon = it.mats.main; VW.mats.flat = new THREE.MeshBasicMaterial({map: t, skinning: true});
  if (it.face) mdFaceMat(VW.mats.flat, it.face);   // the face decal on both lights
  document.getElementById('stage').style.backgroundImage = 'url(' + ASSETS['arena/cascata.jpg'] + ')';
  vwUi(); vwInput(); vwResize(); addEventListener('resize', vwResize);
  vwPlay(0); vwPaint('draw'); vwLight('toon'); vwSpeed(1);
  requestAnimationFrame(vwLoop);
}

// A soft round shadow under the feet.
function vwShadow() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.3, .8), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false}));
  m.rotation.x = -Math.PI / 2; m.position.y = .004; VW.shadow = m;
  return m;
}

function vwUi() {
  const row = document.getElementById('moves');
  VW_PLAYS.forEach(([label], i) => {
    const b = document.createElement('button'); b.id = 'play' + i; b.innerHTML = '<span>' + label + '</span>';
    b.addEventListener('click', () => vwPlay(i)); row.appendChild(b);
  });
  const on = (id, f) => document.getElementById(id).addEventListener('click', f);
  on('pDraw', () => vwPaint('draw')); on('pMeshy', () => vwPaint('meshy'));
  on('lToon', () => vwLight('toon')); on('lFlat', () => vwLight('flat'));
  on('s1', () => vwSpeed(1)); on('s2', () => vwSpeed(.5)); on('s4', () => vwSpeed(.25));
  on('spin', () => { VW.spin = !VW.spin; vwPress('spin', VW.spin); });
  vwPress('spin', VW.spin);
}
function vwPress(id, on) { document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false'); }
function vwPaint(k) {
  VW.paint = k; VW.mats.toon.map = VW.tex[k]; VW.mats.flat.map = VW.tex[k]; VW.mats.toon.needsUpdate = VW.mats.flat.needsUpdate = true;
  if (VW.it.face) mdFaceShow(VW.it.face, k === 'draw');   // the drawn face's decal with the drawing's paint only
  vwPress('pDraw', k === 'draw'); vwPress('pMeshy', k === 'meshy');
}
function vwLight(k) { VW.it.mesh.material = VW.mats[k]; vwPress('lToon', k === 'toon'); vwPress('lFlat', k === 'flat'); }
function vwSpeed(s) { VW.speed = s; vwPress('s1', s === 1); vwPress('s2', s === .5); vwPress('s4', s === .25); }

// Starts button i's steps from the first (the fighter back on the floor, in place).
function vwPlay(i) {
  VW.playing = i; VW.plan = VW_PLAYS[i][1].map(s => typeof s === 'string' ? [s, 0] : s); VW.step = -1;
  for (let k = 0; k < VW_PLAYS.length; k++) vwPress('play' + k, k === i);
  Object.assign(VW.F, {x: 0, y: 0, vy: 0, air: false, hit: 0}); vwNext();
}
function vwNext() {
  const F = VW.F;
  if (++VW.step >= VW.plan.length) VW.step = 0;
  const [act, n, mode] = VW.plan[VW.step], m = CFG.moves[act];
  VW.mode = mode || null; VW.left = n || (m ? m.s + m.a + (m.r === 'land' ? 0 : m.r) : 30);
  F.act = act === 'thrHit' ? 'thr' : act; F.af = act === 'thrHit' ? 1 : 0; F.hit = act === 'thrHit' ? 1 : 0;
  F.stun = act === 'hitStun' || act === 'block' ? VW.left : 0;
  if (mode === 'jump' || mode === 'jumpAtk') { F.air = true; F.y = 1; F.vy = CFG.jump.v; if (mode === 'jumpAtk') { F.act = 'air'; VW.atkIn = 8; } }
  if (mode === 'fly') { F.air = true; F.y = 1; F.vy = 70; }
  VW.name = VW_NAMES[act] || act;
}
// One frame of the fighter state.
function vwStep() {
  const F = VW.F, S = VW.S;
  S.frame++; F.af++; F.stun = Math.max(0, F.stun - 1);
  if (VW.mode === 'walkF') F.x += CFG.walk.f * F.face;
  else if (VW.mode === 'walkB') F.x -= CFG.walk.b * F.face;
  else if (VW.mode === 'dash') F.x += (F.act === 'dashF' ? 1 : -1) * 100 * F.face;
  if (F.air) {
    if (VW.mode === 'jumpAtk' && VW.atkIn > 0 && --VW.atkIn === 0) { F.act = 'jk'; F.af = 0; VW.name = VW_NAMES.jk; }
    F.y += F.vy; F.vy -= CFG.jump.g;
    if (F.y <= 0) { F.y = 0; F.vy = 0; F.air = false; vwNext(); }
    return;
  }
  if (--VW.left <= 0) vwNext();
}

function vwLoop(now) {
  requestAnimationFrame(vwLoop);
  const dt = VW.last === null ? 0 : Math.min(100, now - VW.last); VW.last = now;
  VW.acc += dt * VW.speed * VW_PACE;
  while (VW.acc >= VW_DT) { vwStep(); VW.acc -= VW_DT; }
  if (VW.spin && VW.pointers.size === 0 && now - VW.idleMs > 2500) VW.yaw += dt * .00035;
  const it = VW.it, F = VW.F;
  mdSync(it, 0, VW.S);
  it.root.position.set(0, F.y / 1000, 0); it.root.rotation.y = VW.yaw; it.body.scale.x = it.scale;
  VW.shadow.scale.setScalar(Math.max(.35, 1 - F.y / 2500));
  const cy = .95 + F.y / 2000 + Math.max(0, 1 - VW.zoom) * .75, c = VW.camera, d = VW.fit * VW.zoom;   // zooming in looks up to the face
  c.position.set(0, cy + .1, d); c.lookAt(0, cy, 0);
  VW.renderer.render(VW.scene, c);
  const m = CFG.moves[F.act], tot = m ? m.s + m.a + (m.r === 'land' ? 8 : m.r) : 0;
  const now2 = document.getElementById('now'), txt = VW.name + (m ? '<small>fotogramma ' + F.af + ' di ' + tot + (F.af > m.s && F.af <= m.s + m.a ? ' · colpisce' : '') + '</small>' : '');
  if (now2.innerHTML !== txt) now2.innerHTML = txt;
}

// The picture's centre sits in the middle of the space above the controls (a view offset), and the camera stands back
// just enough for VW_TALL metres to fit in that space (VW.zoom scales it: pinch and wheel).
function vwResize() {
  const w = innerWidth, h = innerHeight, free = Math.max(120, document.getElementById('bottom').getBoundingClientRect().top), dy = h - free, c = VW.camera;
  VW.renderer.setSize(w, h, false);
  c.fov = 30; c.aspect = w / (h + dy); c.setViewOffset(w, h + dy, 0, dy, w, h); c.updateProjectionMatrix();
  const t = Math.tan(c.fov * Math.PI / 360);
  VW.fit = Math.max(VW_TALL * (h + dy) / free / (2 * t), VW_WIDE / (2 * t * c.aspect)) / .92;
}

// Drag turns, pinch or wheel zooms, double tap resets.
function vwInput() {
  const cv = document.getElementById('view'), P = VW.pointers;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); P.set(e.pointerId, {x: e.clientX, y: e.clientY}); VW.pinch = 0; VW.idleMs = performance.now(); });
  cv.addEventListener('pointermove', e => {
    const p = P.get(e.pointerId); if (!p) return;
    if (P.size === 1) VW.yaw += (e.clientX - p.x) * .012;
    else {
      const [a, b] = [...P.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      p.x = e.clientX; p.y = e.clientY;
      const d2 = Math.hypot([...P.values()][0].x - [...P.values()][1].x, [...P.values()][0].y - [...P.values()][1].y);
      if (d > 0 && d2 > 0) VW.zoom = Math.max(.45, Math.min(1.8, VW.zoom * d / d2));
    }
    p.x = e.clientX; p.y = e.clientY; VW.idleMs = performance.now();
  });
  const up = e => { P.delete(e.pointerId); VW.idleMs = performance.now(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); VW.zoom = Math.max(.45, Math.min(1.8, VW.zoom * (1 + e.deltaY * .001))); }, {passive: false});
  cv.addEventListener('dblclick', () => { VW.yaw = VW_YAW; VW.zoom = 1; });
}

VW.tick = n => { for (let k = 0; k < n; k++) { vwStep(); mdSync(VW.it, 0, VW.S); } };   // tests: n frames now, each drawn (the sash moves)
VW.sash = MD_SASH;   // tests: the sash's numbers
window.VW = VW;   // for tests/viewer_check.py
vwBoot();

})();
</script>
