<title>Voidrise Fighters</title>

<style>
:root{--orange:#ff7a1a;--yellow:#ffc83a;--cyan:#35d8ff;--violet:#9b5fe0;--ink:#f4f1ea;--dark:#14121c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);overflow:hidden;font-family:'Barlow Condensed',system-ui,sans-serif;font-style:italic;font-weight:700;touch-action:none;user-select:none}
#app{position:fixed;inset:0;background:var(--dark)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud,#ui{position:absolute;inset:0;pointer-events:none}
/* #ui lets pointers through: any overlay (menu, pause, result) inside #ui must set pointer-events:auto on itself */
#ui{pointer-events:none}
/* touch controls: stick bottom-left (floating), attack buttons bottom-right, as in docs/ref/riferimento-stile.png */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:40%;height:70%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:112px;height:112px;border-radius:50%;background:rgba(20,18,28,.45);border:2px solid rgba(244,241,234,.55);pointer-events:none}
#stickBase.idle{left:calc(env(safe-area-inset-left) + 44px);bottom:26px;opacity:.55}
#stickKnob{position:absolute;left:26px;top:26px;width:56px;height:56px;border-radius:50%;background:rgba(244,241,234,.5);border:2px solid rgba(244,241,234,.85)}
#cluster{position:absolute;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tRow{display:flex;gap:10px;align-items:flex-end}
.tBtn{pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);
  background:rgba(20,18,28,.55);border:2px solid rgba(244,241,234,.7);box-shadow:0 2px 8px rgba(0,0,0,.4);
  font-size:13px;letter-spacing:.04em;line-height:1;transition:transform .06s,filter .06s}
.tBtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tBtn span{pointer-events:none}
.tRound{width:76px;height:76px;border-radius:50%;gap:3px}
.tPill{width:118px;height:44px;border-radius:22px;flex-direction:row;gap:6px}
.tPill svg{width:22px;height:22px}
#tS{background:rgba(255,122,26,.55);border-color:var(--yellow)}
#tK{margin-bottom:14px}
.tBtn.down{transform:scale(.9);filter:brightness(1.5)}
</style>

// Fight simulation core: buttons, state, seeded generator, the fixed step, physics, pushboxes, facing, and hits
// (contacts, damage, hitstop, hitstun, juggle, knockdown and getup).
// Pure and deterministic: integers only (mm, mm/frame, frames), no THREE, DOM, clock or Math.random.
// One step = one frame at 60 per second, fed one integer of buttons per player; graphics only read the state.

const BTN={U:1, D:2, L:4, R:8, P:16, K:32, S:64, DASH:128, GUARD:256};   // directions are absolute (L = screen left)

// af = frame of the current action (1 on its first frame); hold = frames P/K held (see inputPhase);
// prev = last frame's clean buttons; tap = last horizontal press {dir: BTN.L|BTN.R, f: frame}, dir 0 = none;
// land = recovery frames of the current landing; hit = the move in progress has touched (1 hit, 2 blocked);
// stun = hitstun frames left; inv = invulnerable frames left; juggle = hits taken in this juggle;
// buf = the command waiting for the fighter to be free ({cmd, left} frames); sj = this jump is a super jump;
// mute = P/K bits whose release (and heavy) is ignored until released, after a throw command (see readCommand).
function newFighter(side, char) {
  return {side, char, x: side ? CFG.stage.startX : -CFG.stage.startX, y: 0, vx: 0, vy: 0, face: side ? -1 : 1,
    hp: CFG.body.hp, meter: 0, act: 'idle', af: 0, air: false, stun: 0, combo: 0, comboDmg: 0, juggle: 0,
    hit: 0, inv: 0, hold: [0, 0], prev: 0, tap: {dir: 0, f: 0}, buf: {cmd: null, left: 0}, sj: false, land: 0, mute: 0};
}

// opts = {seed, mode: 'versus'|'training', chars: [c0, c1], dummy: 'fermo'|'casuale'}.
// Starts in the round-1 'intro'. timer = frames left in the round (-1 = none, in training); pf = frames in the
// phase; dum = the training dummy's state (c3_dummy.js); rf = frames each fighter has been out of a combo (training refill).
function simCreate(o) {
  const chars = o.chars || ['ren', 'kael'], training = o.mode === 'training';
  return {frame: 0, rng: o.seed | 0, mode: o.mode || 'versus', phase: 'intro', pf: 0, round: 1,
    timer: training ? -1 : CFG.round.timerS * 60, rf: [0, 0],
    wins: [0, 0], winner: -1, stop: 0, sides: [0, 1].map(i => ({team: [newFighter(i, chars[i])], cur: 0})),
    proj: [], ev: [], dummy: o.dummy || 'fermo', dum: [{act: null, left: 0}, {act: null, left: 0}]};
}

function fighterOf(S, side) { const s = S.sides[side]; return s.team[s.cur]; }

// Deep copy: the state is plain JSON (numbers, strings, booleans, null, arrays and objects).
function simClone(S) { return JSON.parse(JSON.stringify(S)); }

// 32-bit FNV-1a, in hex, of the state without this frame's events.
function simHash(S) {
  const {ev, ...state} = S, s = JSON.stringify(state);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x01000193);
  return (h >>> 0).toString(16).padStart(8, '0');
}

// Seeded generator (mulberry32 on the integer S.rng): an integer in [0, n).
function simRand(S, n) {
  const a = S.rng = S.rng + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) % n;
}

// Adds an event of this frame, {t, side, x, y, move, dmg, heavy}: at the fighter's position unless o overrides it.
function simEmit(S, t, F, o) {
  const e = {t, side: F.side, x: F.x, y: F.y, move: null, dmg: 0, heavy: false};
  S.ev.push(o ? Object.assign(e, o) : e);
}

// Input phase, before the command: SOCD-clean buttons (L+R = no horizontal, U+D = no vertical) and the hold
// counters. hold[i] = frames P (i=0) / K (i=1) has been held in this press; on the release frame it still holds
// the press length, so the command reader can tell a tap from a heavy, and the frame after it is back to 0.
function inputPhase(F, raw) {
  let b = raw & 511;   // the 9 BTN bits; a missing input becomes 0
  if ((b & BTN.L) && (b & BTN.R)) b &= ~(BTN.L | BTN.R);
  if ((b & BTN.U) && (b & BTN.D)) b &= ~(BTN.U | BTN.D);
  for (let i = 0; i < 2; i++) {
    const btn = i ? BTN.K : BTN.P;
    if (b & btn) F.hold[i] = F.prev & btn ? F.hold[i] + 1 : 1;
    else if (!(F.prev & btn)) F.hold[i] = 0;
  }
  return b;
}

// This frame's horizontal press if it completes a double tap (same direction twice within dash.tap frames), else 0.
function doubleTapDir(S, F, bits) {
  const h = bits & ~F.prev & (BTN.L | BTN.R);
  return h && h === F.tap.dir && S.frame - F.tap.f <= CFG.dash.tap ? h : 0;
}

// Input history, once the command has read it: this frame's buttons, the muted buttons still held and the last
// horizontal tap (a double tap uses the tap up, so a third press starts a new pair).
function rememberInput(S, F, bits) {
  F.mute &= bits;
  const h = bits & ~F.prev & (BTN.L | BTN.R);
  if (h) { F.tap.dir = doubleTapDir(S, F, bits) ? 0 : h; F.tap.f = S.frame; }
  F.prev = bits;
}

// Velocity, gravity and touchdown at y = 0.
function fighterPhysics(S, F) {
  F.x += F.vx;
  if (!F.air) return;
  F.y += F.vy; F.vy -= CFG.jump.g;
  if (F.y <= 0) { F.y = 0; F.vx = 0; F.vy = 0; F.air = false; touchdown(S, F); }
}

// Pushboxes, walls and maximum separation. Overlapping pushboxes split the overlap half and half, but not while
// either fighter is in the air above body.passY, so a jump can cross over. Walls stop the centres at
// ±(stage.half - body.push), and a fighter in the corner makes the other one take the whole push. Beyond
// stage.maxSep the excess is taken back from whoever moved away this frame (x0 = x before physics, by side).
function pushApart(a, b, x0) {
  const P2 = 2 * CFG.body.push, W = CFG.stage.half - CFG.body.push;
  const solid = a.y <= CFG.body.passY && b.y <= CFG.body.passY;
  const aLeft = a.x !== b.x ? a.x < b.x : a.face >= b.face;
  const l = aLeft ? a : b, r = aLeft ? b : a;
  if (solid && r.x - l.x < P2) { const ov = P2 - (r.x - l.x), h = ov >> 1; l.x -= h; r.x += ov - h; }
  l.x = Math.max(-W, Math.min(W, l.x)); r.x = Math.max(-W, Math.min(W, r.x));
  if (solid && r.x - l.x < P2) { if (l.x === -W) r.x = l.x + P2; else l.x = r.x - P2; }
  const ex = r.x - l.x - CFG.stage.maxSep;
  if (ex > 0) {
    const outL = Math.max(0, x0[l.side] - l.x), outR = Math.max(0, r.x - x0[r.side]);
    let tl = Math.min(outL, Math.max(ex >> 1, ex - outR));   // half each when both moved away
    const tr = Math.min(outR, ex - tl);
    tl += (ex - tl - tr) >> 1;   // more than this frame's motion (fighters placed by hand): split the rest
    l.x += tl; r.x -= ex - tl;
  }
}

// Only fighters in a free ground state turn to face the opponent (a jump or a dash keeps its facing).
function faceOpponent(F, O) { if (FREE[F.act] && O.x !== F.x) F.face = O.x > F.x ? 1 : -1; }

// --- Hits ---

// Damage of the n-th hit of a combo, in %: full for the first scaleFrom-1 hits, then scaleStep less per hit, down to minScale.
function scaleFor(n) { const c = CFG.combo; return Math.max(c.minScale, 100 - c.scaleStep * Math.max(0, n - c.scaleFrom + 1)); }

// Hitstun of the n-th hit of a combo: base up to hit decayFrom-1, then decay frames less per hit, down to minStun.
function hitstunFor(base, n) { const c = CFG.combo; return Math.max(c.minStun, base - c.decay * Math.max(0, n - c.decayFrom + 1)); }

// Knocked down or getting up: always invulnerable (inv counts the frames left, see knockLeft).
const KNOCKED = {knock: 1, getup: 1, rollF: 1, rollB: 1};
// Actions with the crouching hurtbox height.
const CROUCHED = {crouch: 1, guardC: 1, cp: 1, ck: 1, chp: 1, chk: 1};

// A hit can touch F: not invulnerable, not knocked down, not KO'd, getting up or held in a throw, and a juggle still under combo.juggleMax hits.
function canBeHit(F) { return F.inv <= 0 && !KNOCKED[F.act] && F.act !== 'ko' && F.act !== 'thrown' && !(F.act === 'juggle' && F.juggle >= CFG.combo.juggleMax); }

// Hurtboxes in absolute mm, [body, head]: the body is ±body.hurt from the feet to the height minus body.headH,
// the head ±body.head from there to the height (body.h standing, hCrouch crouching, hAir in the air).
function hurtBoxes(F) {
  const b = CFG.body, top = F.y + (F.air ? b.hAir : CROUCHED[F.act] ? b.hCrouch : b.h), neck = top - b.headH;
  return [{x0: F.x - b.hurt, x1: F.x + b.hurt, y0: F.y, y1: neck}, {x0: F.x - b.head, x1: F.x + b.head, y0: neck, y1: top}];
}

// The box of move id in absolute mm, mirrored by the facing, while F is in that move's active frames; else null.
function moveBox(F, id) {
  const m = CFG.moves[id];
  if (!m || F.act !== id || F.af <= m.s || F.af > m.s + m.a) return null;
  const k = m.box, y0 = F.y + k[2], y1 = F.y + k[3];
  return F.face > 0 ? {x0: F.x + k[0], x1: F.x + k[1], y0, y1} : {x0: F.x - k[1], x1: F.x - k[0], y0, y1};
}

// Where A's move touches D, or null: the centre of the overlap of the move box with D's first hurtbox it
// overlaps (body, then head). Only a move in its active frames that has not touched yet, on a fighter that can be hit.
function touchPoint(A, D) {
  const box = A.hit ? null : moveBox(A, A.act);
  if (!box || !canBeHit(D)) return null;
  for (const h of hurtBoxes(D)) {
    const x0 = Math.max(box.x0, h.x0), x1 = Math.min(box.x1, h.x1), y0 = Math.max(box.y0, h.y0), y1 = Math.min(box.y1, h.y1);
    if (x0 < x1 && y0 < y1) return {x: (x0 + x1) >> 1, y: (y0 + y1) >> 1};
  }
  return null;
}

// States that can guard (with GUARD or back held at the moment of contact).
const GUARDING = {idle: 1, walkB: 1, crouch: 1, guard: 1, guardC: 1, block: 1};

// F blocks an attack of this height now: on the ground in a guarding state, holding GUARD or back, and for the
// height: mid either way, low only crouching (D held), high only standing. The held buttons are F.prev (this frame's).
function isBlocking(F, height) {
  if (!GUARDING[F.act] || F.air || !(F.prev & (BTN.GUARD | backBit(F)))) return false;
  const crouching = (F.prev & BTN.D) !== 0;
  return height === 'low' ? crouching : height === 'high' ? !crouching : true;
}

// End of the step: both fighters are checked before either hit lands, so two moves can trade on the same frame.
// Then the throws and the projectiles. A held fighter whose thrower got hit meanwhile (a projectile can) is released.
function contactPhase(S, fs) {
  const id0 = fs[0].act, id1 = fs[1].act, p0 = touchPoint(fs[0], fs[1]), p1 = touchPoint(fs[1], fs[0]);
  if (p0) fs[0].hit = resolveHit(S, fs[0], fs[1], CFG.moves[id0], id0, p0, fs[0].face);
  if (p1) fs[1].hit = resolveHit(S, fs[1], fs[0], CFG.moves[id1], id1, p1, fs[1].face);
  throwPhase(S, fs);
  projectilePhase(S, fs);
  for (const D of fs) if (D.act === 'thrown' && !(fs[1 - D.side].act === 'thr' && fs[1 - D.side].hit)) setAct(D, 'idle');
}

// Move m (id in the events: a move, 'spec' or 'thr') of A touches D, pushing the way dir points. Returns 1 for a
// hit, 2 for a block (what A.hit holds). A blocked move (m.h set, see isBlocking) costs D m.chip, gives A
// meter.block of its damage, hitstops for the block class and leaves D in 'block' for m.bs frames. A hit: damage
// scaled by its number in the combo, meter to both, the hitstop of the move's class, the event at the contact
// point, then D's reaction. The projectile ('spec') has its own events and never sets A.hit (the caller does).
function resolveHit(S, A, D, m, id, pt, dir) {
  const proj = id === 'spec', max = CFG.body.meterMax;
  if (m.h && isBlocking(D, m.h)) {
    const chip = Math.min(D.hp, m.chip || 0);
    D.hp -= chip;
    A.meter = Math.min(max, A.meter + Math.floor(m.dmg * CFG.meter.block));
    S.stop = Math.max(S.stop, CFG.stop[m.stop === 'light' ? 'blockLight' : 'blockHeavy']);
    simEmit(S, proj ? 'projBlock' : 'block', A, {x: pt.x, y: pt.y, move: id, dmg: chip, heavy: m.stop === 'heavy'});
    setAct(D, 'block'); D.stun = m.bs;
    if (dir * D.x >= CFG.stage.half - CFG.body.push && !A.air) { D.vx = 0; A.vx = -dir * m.push; }
    else D.vx = dir * m.push;
    return 2;
  }
  const n = D.combo + 1, dmg = Math.floor(m.dmg * scaleFor(n) / 100);
  D.hp = Math.max(0, D.hp - dmg); D.combo = n; D.comboDmg += dmg;
  A.meter = Math.min(max, A.meter + Math.floor(dmg * CFG.meter.hit));
  D.meter = Math.min(max, D.meter + Math.floor(dmg * CFG.meter.taken));
  S.stop = Math.max(S.stop, CFG.stop[m.stop]);
  simEmit(S, proj ? 'projHit' : 'hit', A, {x: pt.x, y: pt.y, move: id, dmg, heavy: m.stop === 'heavy'});
  hitReaction(A, D, m, n, dir);
  return 1;
}

// A throw (act 'thr', see c2_moves.js) of fighter A: in its active frames it grabs D if the centres are within
// thr.range and D stands on the ground free of stun, not invulnerable and not already held ('thr' event: A plays
// the grab from af 1, D is 'thrown'); at af thr.hitF of the grab the throw hits through resolveHit (it has no height,
// so no block) and D is knocked down. Side 0 goes first, so it wins a grab on the same frame.
function throwPhase(S, fs) {
  const t = CFG.thr;
  for (const A of fs) {
    const D = fs[1 - A.side];
    if (A.act !== 'thr') continue;
    if (!A.hit) {
      if (A.af <= t.s || A.af > t.s + t.a || Math.abs(A.x - D.x) > t.range) continue;
      if (D.air || D.y > 0 || D.stun > 0 || !canBeHit(D)) continue;
      A.hit = 1; A.af = 1; A.vx = 0; D.vx = 0;
      setAct(D, 'thrown'); D.stun = 0;
      simEmit(S, 'thr', A, {x: D.x, y: D.y + CFG.spec.y});
    } else if (A.af === t.hitF) {
      resolveHit(S, A, D, t, 'thr', {x: D.x, y: D.y + CFG.spec.y}, A.face);
    }
  }
}

// Projectiles move at the start of a free step. Here, after the fighters' contacts: two that touch vanish together
// ('projClash'); one that touches the other side's fighter (hurtbox, one that can be hit) hits or is blocked through
// resolveHit and vanishes, and one beyond stage.half + 1000 vanishes too.
function projectilePhase(S, fs) {
  const k = CFG.spec, P = S.proj;
  if (P.length === 2 && Math.abs(P[0].x - P[1].x) <= 2 * k.box && Math.abs(P[0].y - P[1].y) <= 2 * k.box) {
    simEmit(S, 'projClash', fs[P[0].side], {x: (P[0].x + P[1].x) >> 1, y: P[0].y});
    P.length = 0;
    return;
  }
  const keep = [];
  for (const p of P) {
    const D = fs[1 - p.side], pt = canBeHit(D) ? projTouch(p, D) : null;
    if (pt) resolveHit(S, fs[p.side], D, k, 'spec', pt, p.vx > 0 ? 1 : -1);
    else if (Math.abs(p.x) <= CFG.stage.half + 1000) keep.push(p);
  }
  P.length = 0; for (const p of keep) P.push(p);
}

// Centre of the overlap of projectile p (a square of half-size spec.box) with D's first hurtbox it overlaps, or null.
function projTouch(p, D) {
  const b = CFG.spec.box;
  for (const h of hurtBoxes(D)) {
    const x0 = Math.max(p.x - b, h.x0), x1 = Math.min(p.x + b, h.x1), y0 = Math.max(p.y - b, h.y0), y1 = Math.min(p.y + b, h.y1);
    if (x0 < x1 && y0 < y1) return {x: (x0 + x1) >> 1, y: (y0 + y1) >> 1};
  }
  return null;
}

// D's reaction to the n-th hit of a combo, pushed toward dir (the way the attack or projectile goes):
// - knocked down (knock, or airKnock / spike on an airborne D): flies with the move's vx, vy, invulnerable;
// - launched (launch) or hit in the air: juggle, rising at least at the move's vy (else combo.lift), with the
//   move's vx (else its push); one more juggle hit;
// - else hitstun (hitstunFor) and a pushback of push that slides (groundSpeed); at the wall D stays and an
//   attacker on the ground slides back instead (a move without push, like the projectile, moves nobody).
function hitReaction(A, D, m, n, dir) {
  const down = m.knock ? m : D.air ? m.airKnock || (m.spike ? m : null) : null;
  D.stun = 0;
  if (down) {
    setAct(D, 'knock'); D.air = true; D.vx = down.vx ? dir * down.vx : 0; D.vy = down.vy; D.inv = CFG.knock.ground;
  } else if (m.launch || D.air) {
    const vx = m.vx !== undefined ? m.vx : m.push;
    setAct(D, 'juggle'); D.air = true; D.juggle++; D.vx = vx ? dir * vx : 0;
    D.vy = Math.max(D.vy, m.vy !== undefined ? m.vy : CFG.combo.lift);
  } else {
    setAct(D, 'hitStun'); D.stun = hitstunFor(m.hs, n);
    if (m.push && dir * D.x >= CFG.stage.half - CFG.body.push && !A.air) { D.vx = 0; A.vx = -dir * m.push; }
    else D.vx = dir * m.push;
  }
}

// Leaving hitstun or a knockdown: the combo against F is over.
function recoverFrom(F, act) { setAct(F, act); F.combo = 0; F.comboDmg = 0; F.juggle = 0; }

// At the end of a knockdown's ground time: a roll while a direction is held (forward or back for the facing), else a getup.
function wakeAct(F, bits) { return bits & fwdBit(F) ? 'rollF' : bits & backBit(F) ? 'rollB' : 'getup'; }

// Invulnerable frames left while knocked down or getting up: the whole ground time while still flying,
// then to the end of the current action.
function knockLeft(F) { return F.act === 'knock' && F.air ? CFG.knock.ground : actLength(F) - F.af + 1; }

// Roll speed on frame af (1..knock.roll): integer steps that add up to knock.rollDist.
function rollSpeed(af) { const k = CFG.knock; return Math.floor(k.rollDist * af / k.roll) - Math.floor(k.rollDist * (af - 1) / k.roll); }

// --- Rounds ---

// Round phases: 'intro' (round.intro frames, inputs ignored) -> 'fight' -> 'ko' | 'timeup' (inputs ignored, physics
// runs on) -> round.end frames later the round is scored -> next 'intro' or 'end'. In training there is no timer
// and no KO: hp stays at 1 or more and refills, once, when the fighter has been out of a combo (and not blocking)
// for training.refill frames.
function roundStep(S, fs) {
  const R = CFG.round, training = S.mode === 'training';
  if (training) trainingStep(S, fs);
  if (S.phase === 'intro') {
    if (S.pf === 0) simEmit(S, 'round', fs[0]);   // the HUD reads S.round
    if (++S.pf >= R.intro) { S.phase = 'fight'; S.pf = 0; simEmit(S, 'fight', fs[0]); }
  } else if (S.phase === 'fight') {
    S.pf++;
    if (fs[0].hp <= 0 || fs[1].hp <= 0) endRound(S, fs, 'ko');   // whatever the source (chip damage too)
    else if (S.timer > 0 && --S.timer === 0) endRound(S, fs, 'timeup');
  } else if (S.phase === 'end') {
    S.pf++;
  } else if (++S.pf >= R.end) scoreRound(S, fs);   // 'ko' or 'timeup'
}

function trainingStep(S, fs) {
  for (const F of fs) {
    F.hp = Math.max(1, F.hp);
    S.rf[F.side] = F.combo > 0 || F.act === 'block' ? 0 : Math.min(CFG.training.refill + 1, S.rf[F.side] + 1);
    if (S.rf[F.side] === CFG.training.refill) F.hp = CFG.body.hp;   // once, so a hp set by hand is not undone
  }
}

// The round is over: 'ko' (the fighters at 0 hp fall, the KO hitstop) or 'timeup'. Projectiles in flight vanish.
function endRound(S, fs, kind) {
  S.phase = kind; S.pf = 0; S.proj.length = 0;
  if (kind === 'timeup') { simEmit(S, 'timeup', fs[0]); return; }
  S.stop = CFG.stop.ko;
  for (const F of fs) {
    if (F.hp > 0) continue;
    setAct(F, 'ko'); F.stun = 0;
    if (!F.air) { F.air = true; F.vy = CFG.round.ko.vy; F.vx = (F.x < fs[1 - F.side].x ? -1 : 1) * CFG.round.ko.vx; }
    simEmit(S, 'ko', F);
  }
}

// More hp takes the round; equal hp gives it to both. Then the match ends (winner 0, 1 or 2 = both) or the next round starts.
function scoreRound(S, fs) {
  const d = fs[0].hp - fs[1].hp;
  if (d) { const w = d > 0 ? 0 : 1; S.wins[w]++; simEmit(S, 'win', fs[w]); }
  else { S.wins[0]++; S.wins[1]++; simEmit(S, 'draw', fs[0]); }
  const w0 = S.wins[0] >= CFG.round.wins, w1 = S.wins[1] >= CFG.round.wins;
  S.pf = 0;
  if (w0 || w1) { S.phase = 'end'; S.winner = w0 && w1 ? 2 : w0 ? 0 : 1; return; }
  for (const side of S.sides) { const old = side.team[side.cur]; side.team[side.cur] = Object.assign(newFighter(old.side, old.char), {meter: old.meter}); }
  S.round++; S.phase = 'intro'; S.stop = 0;
  S.timer = S.mode === 'training' ? -1 : CFG.round.timerS * 60;
}

// One frame. Input first: clean buttons and hold counters, then the 'charge' event. In hitstop (S.stop > 0) nothing
// else moves: only the buffer takes this frame's command (without expiring) and the input history updates.
// Otherwise: per fighter command and action (c2_moves.js), then the input history -> physics -> pushboxes, walls,
// max separation -> facing -> contacts (a hit sets the next hitstop). Then the round flow. frame++ either way.
function simStep(S, in0, in1) {
  S.ev.length = 0;
  if (S.phase !== 'fight') { in0 = 0; in1 = 0; }   // intro, KO, time up and the end ignore the buttons
  const fs = [fighterOf(S, 0), fighterOf(S, 1)], bits = [inputPhase(fs[0], in0), inputPhase(fs[1], in1)];
  for (let i = 0; i < 2; i++) chargeEvent(S, fs[i], bits[i]);
  if (S.stop > 0) {
    S.stop--;
    for (let i = 0; i < 2; i++) { bufferCommand(S, fs[i], bits[i]); rememberInput(S, fs[i], bits[i]); }
  } else {
    for (const p of S.proj) p.x += p.vx;
    for (let i = 0; i < 2; i++) { actionStep(S, fs[i], bits[i]); rememberInput(S, fs[i], bits[i]); }
    const x0 = [fs[0].x, fs[1].x];
    for (const f of fs) fighterPhysics(S, f);
    pushApart(fs[0], fs[1], x0);
    faceOpponent(fs[0], fs[1]); faceOpponent(fs[1], fs[0]);
    contactPhase(S, fs);
  }
  roundStep(S, fs);
  S.frame++;
}

// Command reading (tap and hold, chains, buffer) and the action state machine. Pure, like c1_sim.js.
// An action's first frame has af = 1: setAct zeroes af and the frame's advance (af++) follows it,
// so the active frames of a move with startup s and a active frames are af = s+1 .. s+a.

// Free ground states: the fighter takes any command and turns to face the opponent.
const FREE = {idle: 1, walkF: 1, walkB: 1, crouch: 1, guard: 1, guardC: 1};
// Actions that move the fighter by themselves: their speed stops with them (setAct). Every other ground action
// keeps the pushback of a hit sliding (groundSpeed).
const SELF_MOVED = {walkF: 1, walkB: 1, dashF: 1, dashB: 1, rollF: 1, rollB: 1};
// The normal that a P/K tap or heavy command gives in each posture: [standing, crouching (D held), in the air].
const NORMALS = {P: ['p1', 'cp', 'jp'], K: ['k1', 'ck', 'jk'], HP: ['hp', 'chp', 'jhp'], HK: ['hk', 'chk', 'jhk']};

function setAct(F, act) { if (SELF_MOVED[F.act]) F.vx = 0; F.act = act; F.af = 0; F.hit = 0; }

// Forward and back buttons for the fighter's facing.
function fwdBit(F) { return F.face > 0 ? BTN.R : BTN.L; }
function backBit(F) { return F.face > 0 ? BTN.L : BTN.R; }

// The command this frame's buttons give, or null. Commands are events, so they can wait in the buffer (F.buf).
// By priority: 'thr' = P and K pressed within input.both frames of each other (the two releases afterwards, and a
// heavy, are muted: F.mute), 'spec' = S press (not while this side has a projectile alive), 'P'/'K' = released after
// a tap (held less than input.hold), 'HP'/'HK' = held to input.hold (a heavy; its release does nothing), 'dashF'/'dashB' = DASH press (back + DASH =
// back dash) or a double tap forward, 'jump' = U press.
function readCommand(S, F, bits) {
  const hold = CFG.input.hold, mP = F.mute & BTN.P, mK = F.mute & BTN.K;
  if ((bits & (BTN.P | BTN.K)) === (BTN.P | BTN.K) && !mP && !mK && (F.hold[0] === 1 || F.hold[1] === 1) &&
      Math.abs(F.hold[0] - F.hold[1]) <= CFG.input.both) return 'thr';
  if (bits & ~F.prev & BTN.S && !S.proj.some(p => p.side === F.side)) return 'spec';
  if (F.prev & BTN.P && !(bits & BTN.P) && F.hold[0] < hold && !mP) return 'P';
  if (F.prev & BTN.K && !(bits & BTN.K) && F.hold[1] < hold && !mK) return 'K';
  if (bits & BTN.P && F.hold[0] === hold && !mP) return 'HP';
  if (bits & BTN.K && F.hold[1] === hold && !mK) return 'HK';
  if (bits & ~F.prev & BTN.DASH) return bits & backBit(F) ? 'dashB' : 'dashF';
  if (doubleTapDir(S, F, bits) === fwdBit(F)) return 'dashF';
  if (bits & ~F.prev & BTN.U) return 'jump';
  return null;
}

// What the held buttons ask for in a free ground state when no command starts: jump (U held, so holding U
// jumps again on landing), guard (GUARD, low with D), crouch (D), walk forward or back; null = idle.
function holdCommand(F, bits) {
  if (bits & BTN.U) return 'jump';
  if (bits & BTN.GUARD) return bits & BTN.D ? 'guardC' : 'guard';
  if (bits & BTN.D) return 'crouch';
  if (bits & fwdBit(F)) return 'walkF';
  if (bits & backBit(F)) return 'walkB';
  return null;
}

// The normal for a P/K tap or heavy command in the fighter's posture now.
function normalFor(F, cmd, bits) { return NORMALS[cmd][F.air ? 2 : bits & BTN.D ? 1 : 0]; }

// What a command starts in the fighter's state now, or null (it waits in the buffer). A free ground state takes
// any command, a jump ('air') its air normals. A move takes only its cancels, from the frame it touched to the end
// of its recovery: tapP/tapK, a heavy (heavy: true = the posture's heavy, or a list of moves), the Special (spec)
// and, after a hit (not a block), the super jump of a jc move. A throw never cancels.
function commandAct(F, cmd, bits) {
  const m = CFG.moves[F.act], normal = NORMALS[cmd] ? normalFor(F, cmd, bits) : null;
  if (m) {
    if (!F.hit) return null;
    if (cmd === 'P') return m.tapP || null;
    if (cmd === 'K') return m.tapK || null;
    if (cmd === 'spec') return m.spec ? 'spec' : null;
    if (cmd === 'jump') return m.jc && F.hit === 1 ? 'superJump' : null;
    return normal && (m.heavy === true || (m.heavy && m.heavy.indexOf(normal) >= 0)) ? normal : null;
  }
  if (F.act === 'air') return normal;
  return FREE[F.act] ? normal || cmd : null;
}

// Starts an action: a move, a movement action (jump = squat first, superJump = squat of a super jump) or idle
// (null). Holding the same walk, crouch or guard keeps its af counting.
function startCommand(S, F, cmd) {
  if (cmd === 'superJump') { setAct(F, 'jumpSquat'); F.sj = true; return; }
  const act = cmd === 'jump' ? 'jumpSquat' : cmd || 'idle';
  if (act === F.act) return;
  setAct(F, act);
  if (act === 'jumpSquat') F.sj = false;
  if (act === 'dashF' || act === 'dashB') simEmit(S, 'dash', F);
}

// This frame's command takes the buffer's place (the newest wins), where it waits up to input.buffer frames.
function bufferCommand(S, F, bits) {
  const cmd = readCommand(S, F, bits);
  if (cmd) { F.buf.cmd = cmd; F.buf.left = CFG.input.buffer; }
  if (cmd === 'thr') F.mute = BTN.P | BTN.K;
  return cmd;
}

// 'charge' once per press: on the frame a held P or K reaches input.chargeShow.
function chargeEvent(S, F, bits) {
  const n = CFG.input.chargeShow;
  if ((bits & BTN.P && F.hold[0] === n) || (bits & BTN.K && F.hold[1] === n)) simEmit(S, 'charge', F);
}

// Length in frames of the timed actions; the others last until something ends them: hitstun ends with stun, an
// air move and a knockdown's flight with the touchdown (the knockdown's ground time starts there).
function actLength(F) {
  const m = CFG.moves[F.act];
  if (m) return m.r === 'land' ? Infinity : m.s + m.a + m.r;
  switch (F.act) {
    case 'jumpSquat': return CFG.jump.squat;
    case 'thr': return F.hit ? CFG.thr.anim : CFG.thr.s + CFG.thr.a;
    case 'thrWhiff': return CFG.thr.whiff;
    case 'spec': return CFG.spec.spawn + CFG.spec.rec;
    case 'landing': return F.land;
    case 'dashF': return CFG.dash.f.n;
    case 'dashB': return CFG.dash.b.n;
    case 'knock': return F.air ? Infinity : CFG.knock.ground;
    case 'getup': return CFG.knock.getup;
    case 'rollF': case 'rollB': return CFG.knock.roll;
    default: return Infinity;
  }
}

// A finished action ends: the squat takes off; a throw that grabbed ends idle and one that missed in a whiff; a knockdown ends in a getup or a roll, and hitstun in idle, both
// ending the combo (recoverFrom); anything else returns to idle.
function endAction(S, F, bits) {
  if (F.act === 'jumpSquat') takeoff(S, F, bits);
  else if (F.act === 'knock') recoverFrom(F, wakeAct(F, bits));
  else if (F.act === 'hitStun') recoverFrom(F, 'idle');
  else if (F.act === 'thr' && !F.hit) setAct(F, 'thrWhiff');
  else setAct(F, 'idle');
}

// Dash speed on frame af (1..n): integer interpolation from v0 to v1.
function dashSpeed(d, af) { return d.v0 + Math.trunc((d.v1 - d.v0) * (af - 1) / Math.max(1, d.n - 1)); }

// Horizontal speed of a ground action on its frame af. Walks, dashes and rolls set their own; any other action
// keeps the pushback of a hit, which slows down by phys.pushFric per frame.
function groundSpeed(F) {
  switch (F.act) {
    case 'walkF': return F.face * CFG.walk.f;
    case 'walkB': return -F.face * CFG.walk.b;
    case 'dashF': return F.face * dashSpeed(CFG.dash.f, F.af);
    case 'dashB': return -F.face * dashSpeed(CFG.dash.b, F.af);
    case 'rollF': return F.face * rollSpeed(F.af);
    case 'rollB': return -F.face * rollSpeed(F.af);
    default: return F.vx > 0 ? Math.max(0, F.vx - CFG.phys.pushFric) : Math.min(0, F.vx + CFG.phys.pushFric);
  }
}

// End of the squat: the jump goes forward or back by the direction held now, relative to the facing;
// a super jump (sj, from a jump cancel) rises at jump.superV.
function takeoff(S, F, bits) {
  setAct(F, 'air'); F.air = true; F.vy = F.sj ? CFG.jump.superV : CFG.jump.v;
  F.vx = bits & fwdBit(F) ? F.face * CFG.jump.vxF : bits & backBit(F) ? F.face * CFG.jump.vxB : 0;
  simEmit(S, 'jump', F);
}

// Physics finds the touchdown after this frame's advance, so this frame is the next action's first (af = 1).
// A knockdown (knock in flight, or a juggle) stays down and its ground time starts ('knock' event);
// an air attack lands into jump.landAtk frames of landing, a jump into jump.land ('land' event).
function touchdown(S, F) {
  if (F.act === 'ko') { F.af = 1; return; }   // a KO'd fighter stays down
  const down = F.act === 'knock' || F.act === 'juggle', m = CFG.moves[F.act];
  F.sj = false;
  setAct(F, down ? 'knock' : 'landing'); F.af = 1;
  if (down) { simEmit(S, 'knock', F); return; }
  F.land = m ? CFG.jump.landAtk : CFG.jump.land;
  simEmit(S, 'land', F);
}

// The Special's frame spawn: a projectile at spec.x ahead of F, heading the way F faces.
function spawnProjectile(S, F) {
  const k = CFG.spec, p = {side: F.side, x: F.x + F.face * k.x, y: k.y, vx: F.face * k.speed, live: 1};
  S.proj.push(p);
  simEmit(S, 'proj', F, {x: p.x, y: p.y});
}

// One frame of a fighter's action (hitstop skips it): this frame's command enters the buffer; a finished action
// ends; the buffered command starts if the state takes it ('heavyFire' for a heavy), else a free state follows
// the held buttons and a waiting command loses a frame. Then af, stun and inv advance, 'whiff' marks a move whose
// active frames ended without contact, and the ground speed is set (in the air the takeoff or hit speed is kept).
function actionStep(S, F, bits) {
  const cmd = bufferCommand(S, F, bits);
  if (F.act === 'hitStun' || F.act === 'block' ? F.stun <= 0 : F.af >= actLength(F)) endAction(S, F, bits);
  const act = F.buf.cmd && commandAct(F, F.buf.cmd, bits);
  if (act) {
    if (F.buf.cmd === 'HP' || F.buf.cmd === 'HK') simEmit(S, 'heavyFire', F, {move: act, heavy: true});
    F.buf.cmd = null; F.buf.left = 0;
    startCommand(S, F, act);
  } else {
    if (FREE[F.act]) startCommand(S, F, holdCommand(F, bits));
    if (F.buf.cmd && !cmd && --F.buf.left <= 0) F.buf.cmd = null;
  }
  F.af++;
  if (F.act === 'spec' && F.af === CFG.spec.spawn) spawnProjectile(S, F);
  if (F.stun > 0) F.stun--;
  F.inv = KNOCKED[F.act] ? knockLeft(F) : Math.max(0, F.inv - 1);
  const m = CFG.moves[F.act];
  if (m && !F.hit && F.af === m.s + m.a + 1) simEmit(S, 'whiff', F, {move: F.act});
  if (!F.air) F.vx = groundSpeed(F);
}

// Training dummy: what the 'casuale' dummy presses. Pure and deterministic like the sim: it reads and advances only S
// (S.dum[side] and the seeded S.rng).

// The six things it picks from, with equal weight: stand still, walk forward, walk back, crouch, jump, guard (hold back).
const DUMMY_ACTS = [F => 0, F => fwdBit(F), F => backBit(F), F => BTN.D, F => BTN.U, F => backBit(F)];

// The buttons for side this frame (an integer of BTN bits): 0 for 'fermo'.
function dummyInput(S, side) {
  if (S.dummy !== 'casuale') return 0;
  const d = S.dum[side], k = CFG.dummy;
  if (d.left <= 0) { d.act = simRand(S, DUMMY_ACTS.length); d.left = k.min + simRand(S, k.max - k.min + 1); }
  d.left--;
  return DUMMY_ACTS[d.act](fighterOf(S, side));
}

// Input layer: two keyboard sets, up to two gamepads and the on-screen touch controls, each reduced to one integer of
// BTN bits per player. Devices are OR-ed together; opposite directions (SOCD) are left to the sim.
const IN={override:[null,null],keys:new Set(),pads:[],touchBits:0,assign:null};
const IN_KEYS=[   // keyboard set 0 = G1 (WASD), set 1 = G2 (arrows + numpad)
  {KeyW:BTN.U,KeyS:BTN.D,KeyA:BTN.L,KeyD:BTN.R,KeyJ:BTN.P,KeyK:BTN.K,KeyL:BTN.S,KeyU:BTN.DASH,KeyI:BTN.GUARD},
  {ArrowUp:BTN.U,ArrowDown:BTN.D,ArrowLeft:BTN.L,ArrowRight:BTN.R,Numpad1:BTN.P,Numpad2:BTN.K,Numpad3:BTN.S,Numpad4:BTN.DASH,Numpad5:BTN.GUARD}];
const IN_PAD_BTN=[[2,BTN.P],[0,BTN.K],[1,BTN.S],[5,BTN.DASH],[4,BTN.GUARD],[12,BTN.U],[13,BTN.D],[14,BTN.L],[15,BTN.R]];   // standard mapping
const IN_DEAD=.45, IN_STICK_R=56;
const IN_TOUCH_BTN={tP:BTN.P,tK:BTN.K,tS:BTN.S,tDash:BTN.DASH,tGuard:BTN.GUARD};
const inTouch={btn:new Map(),stick:null,stickBits:0};   // btn: pointerId -> button id; stick: {id, ox, oy}

function inputPoll(){
  const l=navigator.getGamepads?navigator.getGamepads():[];
  IN.pads=[];
  for(let i=0;l&&i<l.length;i++) IN.pads[i]=l[i]&&l[i].connected!==false?l[i]:null;
}
function inputPadBits(g){
  let b=0;
  for(const [i,bit] of IN_PAD_BTN) if(g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>.5)) b|=bit;
  const x=g.axes[0]||0, y=g.axes[1]||0;
  if(x<-IN_DEAD) b|=BTN.L; if(x>IN_DEAD) b|=BTN.R; if(y<-IN_DEAD) b|=BTN.U; if(y>IN_DEAD) b|=BTN.D;
  return b;
}
function inputRead(p){
  if(IN.override[p]!==null&&IN.override[p]!==undefined) return IN.override[p];
  const a=IN.assign[p]; let b=0;
  for(const set of a.kb) for(const c of IN.keys) b|=IN_KEYS[set][c]||0;
  inputPoll();
  if(a.pad!==null&&IN.pads[a.pad]) b|=inputPadBits(IN.pads[a.pad]);
  if(a.touch) b|=IN.touchBits;
  return b;
}
// mode 'training' | 'versus'; chooser 'kb' | 'touch' | {pad:i} = the device that confirmed "2 Giocatori" (becomes G1).
function inputAssign(mode,chooser){
  if(mode==='training'){
    IN.assign=[{kb:[0,1],pad:0,touch:true},{kb:[],pad:null,touch:false}]; return;
  }
  inputPoll();
  const own=chooser&&typeof chooser==='object'?chooser.pad:null;
  let free=null;
  for(let i=0;i<IN.pads.length&&free===null;i++) if(IN.pads[i]&&i!==own) free=i;
  IN.assign=[{kb:[0],pad:own,touch:true},{kb:[1],pad:free,touch:false}];
}
function inputReleaseAll(){
  IN.keys.clear(); inTouch.btn.clear(); inTouch.stick=null; inTouch.stickBits=0; inputTouchSync(); inputStickDraw(null,0,0);
}
function inputTouchSync(){
  let b=inTouch.stickBits; const held=new Set(inTouch.btn.values());
  for(const id in IN_TOUCH_BTN){
    if(held.has(id)) b|=IN_TOUCH_BTN[id];
    const e=document.getElementById(id); if(e) e.classList.toggle('down',held.has(id));
  }
  IN.touchBits=b;
}
// Draws the stick: o = {x,y} origin in the zone (null = idle spot), (dx,dy) = knob offset in px.
function inputStickDraw(o,dx,dy){
  const base=document.getElementById('stickBase'), knob=document.getElementById('stickKnob'), zone=document.getElementById('stickZone');
  if(!base) return;
  base.classList.toggle('idle',!o);
  if(o){ const r=zone.getBoundingClientRect(); base.style.left=(o.x-r.left-IN_STICK_R)+'px'; base.style.top=(o.y-r.top-IN_STICK_R)+'px'; }
  else { base.style.left=''; base.style.top=''; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
function inputStickMove(e){
  const s=inTouch.stick; let dx=e.clientX-s.ox, dy=e.clientY-s.oy;
  const d=Math.hypot(dx,dy); if(d>IN_STICK_R){ dx*=IN_STICK_R/d; dy*=IN_STICK_R/d; }
  const nx=dx/IN_STICK_R, ny=dy/IN_STICK_R; let b=0;
  if(ny<-IN_DEAD) b|=BTN.U; if(ny>IN_DEAD) b|=BTN.D; if(nx<-IN_DEAD) b|=BTN.L; if(nx>IN_DEAD) b|=BTN.R;
  inTouch.stickBits=b; inputTouchSync(); inputStickDraw({x:s.ox,y:s.oy},dx,dy);
}
function inputCapture(el,id){ try{ el.setPointerCapture(id); }catch(_){} }
// The touch overlay is shown only on touch devices and only while touchShow(true) (a fight); hiding releases everything held.
let inTouchOn=false;
function touchShow(on){
  const coarse=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0;
  inTouchOn=!!on;
  const root=document.getElementById('touch'); if(root) root.classList.toggle('on',inTouchOn&&!!coarse);
  if(!inTouchOn) inputReleaseAll();
}
function inputInitTouch(){
  const root=document.getElementById('touch'); if(!root) return;
  const zone=document.getElementById('stickZone');
  zone.addEventListener('pointerdown',e=>{
    if(inTouch.stick) return;
    e.preventDefault(); inputCapture(zone,e.pointerId);
    inTouch.stick={id:e.pointerId,ox:e.clientX,oy:e.clientY}; inputStickMove(e);
  });
  zone.addEventListener('pointermove',e=>{ if(inTouch.stick&&inTouch.stick.id===e.pointerId){ e.preventDefault(); inputStickMove(e); } });
  const stickEnd=e=>{ if(inTouch.stick&&inTouch.stick.id===e.pointerId){ inTouch.stick=null; inTouch.stickBits=0; inputTouchSync(); inputStickDraw(null,0,0); } };
  for(const t of ['pointerup','pointercancel','lostpointercapture']) zone.addEventListener(t,stickEnd);
  for(const id in IN_TOUCH_BTN){
    const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); inputCapture(el,e.pointerId); inTouch.btn.set(e.pointerId,id); inputTouchSync(); });
    const end=e=>{ if(inTouch.btn.get(e.pointerId)===id){ inTouch.btn.delete(e.pointerId); inputTouchSync(); } };
    for(const t of ['pointerup','pointercancel','lostpointercapture']) el.addEventListener(t,end);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
}
function inputInit(){
  inputAssign('training');
  window.addEventListener('keydown',e=>{
    if(!IN_KEYS[0][e.code]&&!IN_KEYS[1][e.code]) return;
    e.preventDefault(); IN.keys.add(e.code);
  });
  window.addEventListener('keyup',e=>{
    if(!IN_KEYS[0][e.code]&&!IN_KEYS[1][e.code]) return;
    e.preventDefault(); IN.keys.delete(e.code);
  });
  window.addEventListener('blur',inputReleaseAll);
  inputInitTouch();
}

// Renderer: the WebGL canvas, the side camera, the painted backdrop with the flowing waterfall, drifting leaves, the
// fighters (e_fighter3d.js), their blob shadows and toScreen. Graphics only: it reads the sim state and never writes it.
// The 3D world is in metres: x = F.x/1000, y = F.y/1000, z = 0 (side 0 at +0.05, side 1 at -0.05); the camera looks
// along -z without pitch. The backdrop is a full-screen quad drawn first, with its own camera, so the 3D scene
// (fighters, leaves, shadows) draws over it.

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('game'), antialias: false});
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CFG.cam.fov, 1, .1, 60);
const cam = {x: 0, y: 0, dist: CFG.cam.dist0};   // the camera as computed, in metres (y follows from dist)
// mat = the backdrop's ShaderMaterial, leaves = the leaves' Group, footRowY() = screen y (px) of the image's foot row.
const ARENA = {mat: null, leaves: new THREE.Group(), footRowY: rdFootRowY};
// Private state: the backdrop's scene and camera (a fixed clip-space square: nothing to update on resize),
// W, H = screen in CSS px, imgW, imgH = backdrop image in px, v = scratch vector, shadows = one disc per side.
const RD = {bgScene: new THREE.Scene(), bgCam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), W: 1, H: 1,
  imgW: 1, imgH: 1, v: new THREE.Vector3(), shadows: [], seed: 7};
// Cosmetic values (not balance). Shadow disc: w x d metres, scaled by max(min, 1 - height/fade) (height in metres).
// Leaves: z and the height range of the front/back half; ranges are [min, spread] (metres, m/s, rad/s); amp = bob
// height, bob/turn = rates of the bob and of the turning (the narrowing); swing = [amplitude rad, rate as a share of
// the bob rate] of the rotation; margin = metres beyond the widest view where a leaf wraps round.
const RD_SHADOW = {w: 1.1, d: .7, fade: 2.5, min: .3};
const RD_LEAF = {z: [1.5, -2], y: [[.35, 2.3], [.6, 3]], size: [.13, .08], speed: [.45, .6], amp: [.12, .22],
  bob: [1, 1.2], turn: [1.5, 2], swing: [.7, .8], margin: .5};

// The backdrop quad covers the clip square; uPlace maps its screen uv (0..1, y up) to image uv: xy + vS * zw.
const RD_BG_VERT = 'varying vec2 vS;\nvoid main(){ vS = uv; gl_Position = vec4(position.xy, 0., 1.); }';
// Colour grade (contrast/lift); on the waterfall (mask m) the image shimmers (wobble) and stretched value noise
// scrolls down as streaks. The noise runs only where m > 0, so the rest of the backdrop costs two texture reads.
// The hash is Inigo Quilez's sin-free one; the noise repeats every 64 cells in y, so its scroll wraps without a seam
// and the hash input stays small (precise in long sessions).
const RD_BG_FRAG = `
uniform sampler2D uMap, uMask;
uniform vec4 uPlace;
uniform float uTime, uContrast, uLift, uFlow, uStreak, uWobble;
varying vec2 vS;
float rdHash(vec2 p){ p = 50. * fract(p * .3183099 + vec2(.71, .113)); return fract(p.x * p.y * (p.x + p.y)); }
float rdNoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  float y0 = mod(i.y, 64.), y1 = mod(i.y + 1., 64.);
  return mix(mix(rdHash(vec2(i.x, y0)), rdHash(vec2(i.x + 1., y0)), f.x),
             mix(rdHash(vec2(i.x, y1)), rdHash(vec2(i.x + 1., y1)), f.x), f.y);
}
void main(){
  vec2 uv = uPlace.xy + vS * uPlace.zw;
  float m = texture2D(uMask, uv).r;
  vec2 w = uv + vec2(0., sin(uv.x * 90. + mod(uTime * 3., 6.2831853)) * uWobble * m);
  vec3 c = (texture2D(uMap, w).rgb - .5) * uContrast + .5 + uLift;
  if (m > .004) c += m * (rdNoise(vec2(uv.x * 140., uv.y * 6. + mod(uTime * uFlow * 6., 64.))) - .5) * uStreak;
  gl_FragColor = vec4(c, 1.);
}`;

// A texture from an embedded image (an ASSETS data URI), once the image is decoded.
function rdTexture(key) {
  const img = new Image();
  img.src = ASSETS[key];
  return img.decode().then(() => { const t = new THREE.Texture(img); t.needsUpdate = true; return t; },
    () => { throw new Error('cannot decode asset ' + key); });
}

// A small canvas texture drawn by draw(ctx, size).
function rdCanvasTexture(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return new THREE.CanvasTexture(c);
}

// Render-only generator (mulberry32 on RD.seed), so a frame drawn at a given time is always the same.
function rdRand() {
  let t = RD.seed = RD.seed + 0x6D2B79F5 | 0;
  t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rdIn(r) { return r[0] + rdRand() * r[1]; }   // in the range [min, spread]

// Loads the backdrop and its water mask, then builds the backdrop, the leaves and the shadows. Resolves once the
// textures are decoded and uploaded, so the first frame does not stall.
function renderInit() {
  renderer.autoClear = false;
  return Promise.all([rdTexture('arena/cascata.jpg'), rdTexture('arena/cascata_mask.png')]).then(([map, mask]) => {
    const a = CFG.arena, gl2 = renderer.capabilities.isWebGL2;
    map.generateMipmaps = gl2;   // WebGL1 has no mipmaps for this non-power-of-two image (three would shrink it)
    map.minFilter = gl2 ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
    mask.generateMipmaps = false; mask.minFilter = THREE.LinearFilter;
    RD.imgW = map.image.width; RD.imgH = map.image.height;
    ARENA.mat = new THREE.ShaderMaterial({vertexShader: RD_BG_VERT, fragmentShader: RD_BG_FRAG, depthTest: false,
      depthWrite: false, uniforms: {uMap: {value: map}, uMask: {value: mask}, uPlace: {value: new THREE.Vector4()},
        uTime: {value: 0}, uContrast: {value: a.contrast}, uLift: {value: a.lift}, uFlow: {value: a.flow},
        uStreak: {value: a.streak}, uWobble: {value: a.wobble}}});
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ARENA.mat);
    bg.frustumCulled = false; RD.bgScene.add(bg);
    rdLeavesBuild(); rdShadowsBuild(); rdFightersBuild();
    renderer.initTexture(map); renderer.initTexture(mask);
    renderer.compile(scene, camera);   // the fighters' shaders now, not on the first frame of a fight
    window.addEventListener('resize', renderResize);
    renderResize();
  });
}

// Screen size, pixel ratio (at most 2), the 3D camera's aspect and the backdrop placement.
function renderResize() {
  RD.W = Math.max(1, innerWidth); RD.H = Math.max(1, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(RD.W, RD.H);
  camera.aspect = RD.W / RD.H; camera.updateProjectionMatrix();
  rdCamApply(); rdPlace();
}

// Draws S (null = no match: the empty arena) at nowMs: camera, backdrop, leaves, shadows, fighters, then the 3D scene.
function renderFrame(S, nowMs) {
  ARENA.mat.uniforms.uTime.value = nowMs / 1000;
  rdCamStep(S); rdPlace(); rdLeavesStep(nowMs); rdShadowsStep(S); f3Sync(S);
  renderer.clear();
  renderer.render(RD.bgScene, RD.bgCam);
  renderer.render(scene, camera);
}

// World point (metres) -> screen px {x, y} from the top left, through the camera as last placed.
function toScreen(xm, ym, zm) {
  const v = RD.v.set(xm, ym, zm).project(camera);
  return {x: (v.x + 1) / 2 * RD.W, y: (1 - v.y) / 2 * RD.H};
}

// --- Camera ---
// Target x = the fighters' midpoint (within ±xMax); target dist = the largest of dist0, the distance that fits both
// fighters with marginX each side (for this screen's aspect) and the one that fits the highest head (feet + body.h)
// with marginTop, at most distMax. cam closes `smooth` of the gap per drawn frame.
function rdCamStep(S) {
  const k = CFG.cam, t = Math.tan(k.fov * Math.PI / 360);
  let x = 0, d = k.dist0;
  if (S) {
    const a = fighterOf(S, 0), b = fighterOf(S, 1);
    x = Math.max(-k.xMax, Math.min(k.xMax, (a.x + b.x) / 2000));
    const half = Math.max(Math.abs(a.x / 1000 - x), Math.abs(b.x / 1000 - x)) + k.marginX;
    const top = (Math.max(a.y, b.y) + CFG.body.h) / 1000 + k.marginTop;
    d = Math.min(k.distMax, Math.max(d, half / (t * camera.aspect), top / (2 * k.footScreen * t)));
  }
  cam.x += (x - cam.x) * k.smooth; cam.dist += (d - cam.dist) * k.smooth;
  rdCamApply();
}

// cam.y keeps the ground (y = 0 under the camera) at footScreen of the screen height, at any distance.
function rdCamApply() {
  const k = CFG.cam;
  cam.y = cam.dist * (k.footScreen - .5) * 2 * Math.tan(k.fov * Math.PI / 360);
  camera.position.set(cam.x, cam.y, cam.dist);
  camera.updateMatrixWorld();
}

// --- Backdrop ---
// Scale (screen px per image px) = the smallest cover of the screen x cover x (dist0/dist)^zoomPar, and never less
// than what still covers the screen; the image's footRow sits at the screen y of the ground under the camera (the
// zoom is centred there); parallax shifts the image by -cam.x * parX image widths.
function rdPlace() {
  const a = CFG.arena, W = RD.W, H = RD.H, iw = RD.imgW, ih = RD.imgH;
  RD.v.set(cam.x, 0, 0).project(camera);
  const gy = (1 - RD.v.y) / 2 * H, par = cam.x * a.parX;
  const s = Math.max(Math.max(W / iw, H / ih) * a.cover * Math.pow(CFG.cam.dist0 / cam.dist, a.zoomPar),
    W / (iw * (1 - 2 * Math.abs(par))), gy / (a.footRow * ih), (H - gy) / ((1 - a.footRow) * ih));
  const su = W / (iw * s), sv = H / (ih * s);   // image uv per screen uv
  ARENA.mat.uniforms.uPlace.value.set(.5 + par - su / 2, 1 - a.footRow - (H - gy) / (ih * s), su, sv);
}

// The screen y (px from the top) where the placed backdrop shows its foot row: the shader's mapping, inverted.
function rdFootRowY() {
  const p = ARENA.mat.uniforms.uPlace.value;
  return RD.H * (1 - (1 - CFG.arena.footRow - p.y) / p.w);
}

// --- Leaves ---
// arena.leaves sprites, half in front of the fighters and half behind, each with its own size, speed and flutter
// (and its own material: a sprite's rotation lives on its material).
function rdLeavesBuild() {
  const L = RD_LEAF, tex = rdCanvasTexture(64, (g, n) => {
    const gr = g.createLinearGradient(0, n * .3, 0, n * .7);
    gr.addColorStop(0, '#eef27c'); gr.addColorStop(1, '#93be3a');
    g.fillStyle = gr; g.beginPath(); g.moveTo(n * .06, n / 2);
    g.quadraticCurveTo(n * .4, n * .14, n * .94, n / 2); g.quadraticCurveTo(n * .4, n * .86, n * .06, n / 2); g.fill();
    g.strokeStyle = 'rgba(92,124,34,.8)'; g.lineWidth = n / 32;
    g.beginPath(); g.moveTo(n * .1, n / 2); g.lineTo(n * .86, n / 2); g.stroke();
  });
  for (let i = 0; i < CFG.arena.leaves; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false})), k = i % 2;
    sp.userData = {z: L.z[k], y0: rdIn(L.y[k]), x0: rdRand() * 100, v: rdIn(L.speed), amp: rdIn(L.amp), bob: rdIn(L.bob),
      turn: rdIn(L.turn), rot: rdRand() * 6.283, ph: rdRand() * 6.283, size: rdIn(L.size)};
    ARENA.leaves.add(sp);
  }
  scene.add(ARENA.leaves);
}

// Each leaf drifts left to right through a window around the camera that is wider than the view even at distMax, so
// it wraps round off screen; it bobs, swings and turns (the narrowing) as it goes. A function of nowMs only.
function rdLeavesStep(nowMs) {
  const t = nowMs / 1000, tn = Math.tan(CFG.cam.fov * Math.PI / 360), ch = ARENA.leaves.children, R = RD_LEAF;
  for (let i = 0; i < ch.length; i++) {
    const sp = ch[i], L = sp.userData;
    const span = 2 * ((CFG.cam.distMax - L.z) * tn * camera.aspect + R.margin), left = cam.x - span / 2;
    sp.position.set(left + ((L.x0 + L.v * t - left) % span + span) % span, L.y0 + L.amp * Math.sin(L.bob * t + L.ph), L.z);
    sp.scale.set(L.size, L.size * (.2 + .8 * Math.abs(Math.cos(L.turn * t + L.ph))), 1);
    sp.material.rotation = L.rot + R.swing[0] * Math.sin(R.swing[1] * L.bob * t + L.ph);
  }
}

// --- Shadows ---
// A black radial disc (45% at the centre) flat on the ground under each fighter; it shrinks as the fighter rises.
function rdShadowsBuild() {
  const tex = rdCanvasTexture(64, (g, n) => {
    const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    gr.addColorStop(0, 'rgba(0,0,0,.45)'); gr.addColorStop(.6, 'rgba(0,0,0,.36)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, n, n);
  });
  const geo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({map: tex, transparent: true, depthWrite: false});
  for (let i = 0; i < 2; i++) { const m = new THREE.Mesh(geo, mat); m.visible = false; RD.shadows.push(m); scene.add(m); }
}

function rdShadowsStep(S) {
  for (let i = 0; i < 2; i++) {
    const m = RD.shadows[i];
    m.visible = !!S;
    if (!S) continue;
    const F = fighterOf(S, i), k = Math.max(RD_SHADOW.min, 1 - F.y / 1000 / RD_SHADOW.fade);
    m.position.set(F.x / 1000, .005, i ? -.05 : .05);
    m.scale.set(RD_SHADOW.w * k, 1, RD_SHADOW.d * k);
  }
}

// --- Fighters ---
// The two placeholder fighters (side 0 Ren, side 1 Kael; F3D) and the light they are shaded by.
function rdFightersBuild() {
  scene.add(...f3Lights());
  for (const c of ['ren', 'kael']) { const it = fighterBuild(c); F3D.push(it); scene.add(it.root); }
}

// Placeholder fighters (Tappa 1; the Meshy models replace them in Tappa 2): a rig of THREE.Group joints carrying
// toon-shaded parts, each with a black outline shell, posed on every drawn frame from the sim state. Graphics only:
// it reads the state and never writes it. d_render.js builds them (fighterBuild) and calls f3Sync(S) per frame.
// Model space: forward +z, up +y, the fighter's left +x, metres, the root at the feet; 1.8 m tall. The root turns to
// face the opponent (face * 90°), 25° of it back toward the camera.

const F3D = [];   // per side: {root, joints: {name: Group}, limbs: {handL, handR, footL, footR}: Object3D, mats: {slot: material}}
// Shared by both fighters: toon gradient, outline material, shapes (and their outline shells), scratch objects.
const F3 = {grad: null, outMat: null, geo: {}, out: new Map(), v: new THREE.Vector3(), e: new THREE.Euler(),
  m: new THREE.Matrix4(), m2: new THREE.Matrix4(), m3: new THREE.Matrix4(), memo: {}};

// Material slots (the brief's palette). main = the outfit's main colour: Ren's vest, Kael's suit.
const F3_COL = {

    fist: 0x2a2233, boot: 0x2a2233, sole: 0x9b5fe0},

// Rest skeleton, parents first: joint -> [parent, x, y, z] offset from the parent. Arms and legs hang straight down.
const F3_BONE = {pelvis: [null, 0, 1, 0], spine: ['pelvis', 0, .11, 0], chest: ['spine', 0, .19, 0], neck: ['chest', 0, .21, 0],
  head: ['neck', 0, .07, 0], shL: ['chest', .22, .17, 0], elL: ['shL', 0, -.29, 0], wrL: ['elL', 0, -.26, 0],

const F3_J = Object.keys(F3_BONE);
// The points that hit (limbWorld): fist centres and boot centres (0.05 m up when standing).
const F3_LIMB = {handL: ['wrL', 0, -.055, 0], handR: ['wrR', 0, -.055, 0], footL: ['anL', 0, -.03, .045], footR: ['anR', 0, -.03, .045]};
// Parts: [joint, material slot, shape]. 22 meshes per fighter, each with its outline shell.
const F3_PART = [['pelvis', 'pants', 'hips'], ['pelvis', 'sash', 'sash'], ['spine', 'main', 'belly'], ['chest', 'main', 'chest'],
  ['chest', 'inner', 'panel'], ['neck', 'skin', 'neck'], ['head', 'skin', 'head'], ['head', 'hair', 'hair'],
  ['shL', 'skin', 'upper'], ['elL', 'wrap', 'fore'], ['wrL', 'fist', 'fist'], ['shR', 'skin', 'upper'], ['elR', 'wrap', 'fore'],

// --- Shapes ---
// Built once, shared by both fighters; metres in the joint's frame, baked (never scaled on the mesh, so the outline
// keeps its width). Pieces merged into one shape share its material.
function f3Cyl(rt, rb, h, x, y, z, seg, sz) { return new THREE.CylinderGeometry(rt, rb, h, seg || 8).scale(1, 1, sz || 1).translate(x, y, z); }
function f3Sph(r, x, y, z, sx, sy, sz, ws, hs) { return new THREE.SphereGeometry(r, ws || 10, hs || 7).scale(sx, sy, sz).translate(x, y, z); }
function f3Box(w, h, d, x, y, z) { return new THREE.BoxGeometry(w, h, d).translate(x, y, z); }
// A cone from base point (x, y, z) along direction (dx, dy, dz), length len, base radius r.
function f3Spike(x, y, z, dx, dy, dz, len, r) {
  const g = new THREE.ConeGeometry(r, len, 5).translate(0, len / 2, 0), d = new THREE.Vector3(dx, dy, dz).normalize();
  return g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d))).translate(x, y, z);
}
// Positions, normals and indices of indexed geometries in one geometry (the uvs are not needed: no textures).
function f3Merge(gs) {
  let n = 0, m = 0;
  for (const g of gs) { n += g.attributes.position.count; m += g.index.count; }
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), idx = new Uint16Array(m);
  let v = 0, k = 0;
  for (const g of gs) {
    pos.set(g.attributes.position.array, v * 3); nor.set(g.attributes.normal.array, v * 3);
    for (let i = 0; i < g.index.count; i++) idx[k++] = g.index.array[i] + v;
    v += g.attributes.position.count; g.dispose();
  }
  const o = new THREE.BufferGeometry();
  o.setAttribute('position', new THREE.BufferAttribute(pos, 3)); o.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  o.setIndex(new THREE.BufferAttribute(idx, 1));
  return o;
}
// Hair: a cap over the top and back of the head plus spikes [x, y, z, dx, dy, dz, len, r] (head frame).
function f3Hair(cap, spikes) { return f3Merge([f3Sph(cap, 0, .125, -.008, 1, .96, 1.06, 12, 8)].concat(spikes.map(s => f3Spike(...s)))); }
const F3_SHAPE = {
  hips: () => f3Cyl(.15, .162, .2, 0, -.05, 0, 10, .86),
  // Waist band, a knot at the front and two tails hanging down the front (seen from either side).
  sash: () => f3Merge([f3Cyl(.166, .168, .075, 0, .02, 0, 10, .88), f3Sph(.047, .03, .02, .142, 1, .9, .8, 8, 6),
    f3Box(.07, .3, .02, .052, -.13, .15).rotateZ(.1), f3Box(.06, .25, .02, .002, -.105, .152).rotateZ(-.08)]),
  belly: () => f3Cyl(.165, .15, .2, 0, .09, 0, 10, .84),
  // Tapered chest: broad shoulders.

  panel: () => f3Merge([new THREE.ConeGeometry(.1, .26, 3).rotateY(Math.PI / 3).rotateZ(Math.PI).scale(1, 1, .25).translate(0, .1, .14),
    f3Cyl(.09, .105, .09, 0, .235, -.01, 10)]),
  neck: () => f3Cyl(.056, .064, .12, 0, .05, 0, 8),
  head: () => f3Sph(.105, 0, .11, .01, .9, 1.1, 1, 12, 9),
  // Deltoid, upper arm and elbow ball.
  upper: () => f3Merge([f3Sph(.086, 0, -.02, 0, 1, 1, 1), f3Cyl(.072, .056, .29, 0, -.145, 0), f3Sph(.055, 0, -.29, 0, 1, 1, 1, 8, 6)]),
  // Forearm with two raised wraps (Ren's bandages, Kael's glove bands).
  fore: () => f3Merge([f3Cyl(.059, .046, .26, 0, -.13, 0), f3Cyl(.063, .061, .025, 0, -.09, 0), f3Cyl(.056, .053, .025, 0, -.19, 0)]),
  fist: () => f3Sph(.064, 0, -.055, .005, .9, 1, 1.05, 9, 7),
  // Baggy trousers: wider at the knee, gathered at the ankle.
  thigh: () => f3Cyl(.1, .128, .45, 0, -.215, 0, 10),
  shin: () => f3Cyl(.128, .07, .4, 0, -.18, 0, 10),
  boot: () => f3Merge([f3Cyl(.062, .066, .15, 0, .04, 0), f3Box(.11, .085, .25, 0, -.035, .05)]),
  sole: () => f3Box(.118, .025, .26, 0, -.0675, .05),
  hair_ren: () => f3Hair(.12, [[0, .2, -.04, 0, .75, -.66, .2, .055], [.05, .2, -.03, .45, .8, -.4, .17, .05], [-.05, .2, -.03, -.45, .8, -.4, .17, .05],
    [0, .14, -.09, 0, .2, -1, .17, .055], [.06, .08, -.08, .6, -.1, -.8, .13, .045], [-.06, .08, -.08, -.6, -.1, -.8, .13, .045],
    [.09, .13, -.02, 1, .25, -.1, .11, .04], [-.09, .13, -.02, -1, .25, -.1, .11, .04], [.01, .21, .04, .1, .9, .4, .14, .05],
    [0, .19, .07, 0, -.5, .87, .1, .035], [.04, .18, .07, .35, -.6, .7, .09, .03], [-.04, .18, .07, -.35, -.6, .7, .09, .03]]),
  hair_kael: () => f3Hair(.122, [[0, .21, -.02, 0, 1, -.3, .24, .06], [.05, .2, -.02, .5, .85, -.25, .2, .055], [-.05, .2, -.02, -.5, .85, -.25, .2, .055],
    [0, .17, -.08, 0, .5, -.87, .22, .06], [.06, .13, -.08, .55, .3, -.78, .18, .05], [-.06, .13, -.08, -.55, .3, -.78, .18, .05],
    [.09, .14, 0, .95, .3, .1, .14, .045], [-.09, .14, 0, -.95, .3, .1, .14, .045], [.085, .1, .03, .5, -.85, .2, .14, .035],
    [-.085, .1, .03, -.5, -.85, .2, .14, .035], [.02, .2, .05, .2, .6, .78, .15, .05], [-.02, .18, .075, -.2, -.5, .85, .11, .035]]),

// The outline shell's push per vertex: the mean of the distinct normals found at that position, lengthened so every
// face moves out by the full width (so box edges and cylinder rims stay closed); at most twice, on sharp tips.
function f3OutlineGeo(g) {
  const p = g.attributes.position, nr = g.attributes.normal, at = new Map(), out = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const key = Math.round(p.getX(i) * 1e4) + ',' + Math.round(p.getY(i) * 1e4) + ',' + Math.round(p.getZ(i) * 1e4);
    if (!at.has(key)) at.set(key, []);
    at.get(key).push(i);
  }
  for (const ids of at.values()) {
    const ns = [], a = new THREE.Vector3();
    for (const i of ids) { const n = new THREE.Vector3().fromBufferAttribute(nr, i); if (!ns.some(u => u.dot(n) > .999)) ns.push(n); }
    for (const n of ns) a.add(n);
    if (a.lengthSq() < 1e-8) a.copy(ns[0]); else a.normalize();
    let lo = 1;
    for (const n of ns) lo = Math.min(lo, a.dot(n));
    a.multiplyScalar(1 / Math.max(.5, lo));
    for (const i of ids) out.set([a.x, a.y, a.z], i * 3);
  }
  const o = new THREE.BufferGeometry();
  o.setAttribute('position', p); o.setAttribute('aOut', new THREE.BufferAttribute(out, 3)); o.setIndex(g.index);
  g.computeBoundingSphere(); o.boundingSphere = g.boundingSphere.clone(); o.boundingSphere.radius += 2 * F3_OUTLINE.w;
  return o;
}

// The shared gradient (3 bands), outline material and shapes, once.
function f3Shared() {
  if (F3.grad) return;
  const d = new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]);
  F3.grad = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  F3.grad.minFilter = F3.grad.magFilter = THREE.NearestFilter; F3.grad.generateMipmaps = false; F3.grad.needsUpdate = true;
  F3.outMat = new THREE.ShaderMaterial({side: THREE.BackSide,
    uniforms: {uW: {value: F3_OUTLINE.w}, uColor: {value: new THREE.Color(F3_OUTLINE.color)}},
    vertexShader: 'attribute vec3 aOut;\nuniform float uW;\nvoid main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + aOut * uW, 1.); }',
    fragmentShader: 'uniform vec3 uColor;\nvoid main(){ gl_FragColor = vec4(uColor, 1.); }'});
  for (const k in F3_SHAPE) { const g = F3_SHAPE[k](); F3.geo[k] = g; F3.out.set(g, f3OutlineGeo(g)); }
}

// The fighters' light: a warm sun from the upper left (as in the painting, and a little in front) and a sky/stone fill.
function f3Lights() {
  const sun = new THREE.DirectionalLight(0xfff2dc, .75);
  sun.position.set(-4, 6, 5);
  return [sun, new THREE.HemisphereLight(0xdcecff, 0x6b5a4a, .5)];
}

// One fighter ('ren' | 'kael'): joints, toon parts with outlines, limb points and its own materials (so effects can
// flash one fighter). Not yet in the scene.
function fighterBuild(char) {
  f3Shared();
  const col = F3_COL[char], mats = {}, joints = {}, limbs = {}, root = new THREE.Group();
  for (const k in col) mats[k] = new THREE.MeshToonMaterial({color: col[k], gradientMap: F3.grad});
  for (const j of F3_J) { const b = F3_BONE[j], g = new THREE.Group(); g.position.set(b[1], b[2], b[3]); joints[j] = g; (b[0] ? joints[b[0]] : root).add(g); }
  for (const [j, slot, shape] of F3_PART) {
    const g = F3.geo[shape === 'hair' ? 'hair_' + char : shape], mesh = new THREE.Mesh(g, mats[slot]);
    mesh.name = j + '.' + shape;
    mesh.add(new THREE.Mesh(F3.out.get(g), F3.outMat));
    joints[j].add(mesh);
  }
  for (const l in F3_LIMB) { const b = F3_LIMB[l], o = new THREE.Object3D(); o.position.set(b[1], b[2], b[3]); joints[b[0]].add(o); limbs[l] = o; }
  return {root, joints, limbs, mats};
}

// Every drawn frame: each side's fighter at its sim position (feet at F.x, F.y; side 0 in front), facing and pose.
// S null (no match): hidden.
function f3Sync(S) {
  for (let i = 0; i < F3D.length; i++) {
    const it = F3D[i];
    it.root.visible = !!S;
    if (!S) continue;
    const F = fighterOf(S, i);
    it.root.position.set(F.x / 1000, F.y / 1000, i ? -.05 : .05);
    it.root.rotation.y = F.face * F3_YAW;
    f3Apply(it, poseOf(F, S));
  }
}

function f3Apply(it, p) {
  const J = it.joints, D = F3_DEG, b = F3_BONE.pelvis;
  for (const j of F3_J) { const r = p[j]; J[j].rotation.set(r[0] * D, r[1] * D, r[2] * D); }
  J.pelvis.position.set(b[1] + p.pos[0], b[2] + p.pos[1], b[3] + p.pos[2]);
}

// World position (metres) of a limb point of side's fighter, as last posed.
function limbWorld(side, limb) { return F3D[side].limbs[limb].getWorldPosition(new THREE.Vector3()); }

// --- Poses ---
// A pose: {joint: [x, y, z] degrees (Euler XYZ in the parent joint's frame), pos: [x, y, z] pelvis offset (m)}, and
// optionally fL / fR: an ankle target (model space, m; 0.08 up = standing) that the leg reaches by IK. Signs:
// pelvis/spine/chest/neck/head x+ = bend forward, y+ = turn the right shoulder forward, z+ = lean right; shoulder x- =
// arm forward, shL z+ / shR z- = arm out; elbow x- = bend; hip x- = leg forward, knee x+ = bend; ankle x+ = toes down.
// Key poses (b = based on another key; a key that sets a leg's angles drops the inherited target of that leg).
const F3_KEY = {
  // Fighting stance, left side forward: lead fist high, rear fist at the chin, knees soft.
  stance: {pos: [0, -.07, 0], fL: [.11, .08, .21], fR: [-.13, .08, -.2], pelvis: [0, -4, 0], spine: [6, -2, 0], chest: [4, -4, 0],
    neck: [0, 6, 0], head: [-8, 10, 0], shL: [-55, -10, 15], elL: [-105, 0, 0], shR: [-30, 10, -20], elR: [-130, 0, 0]},
  // Walks sit a little lower than the stance, so every step stays within the legs' reach (the feet never slide).
  walkF: {b: 'stance', pos: [0, -.1, 0]},

// Cosmetic timings: walk stride (two steps, m), foot lift and fade-in frames; breathing rate (rad/frame) and depth.
const F3_WALK = {stride: .72, lift: .07, fade: 4}, F3_BREATH = {rate: .08, chest: 1.5, rise: .008};

function f3Lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function f3Smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

// A key pose, resolved once (every joint, legs with a target solved).
function f3Key(name) {
  if (F3.memo[name]) return F3.memo[name];
  const k = F3_KEY[name], base = k.b ? f3Key(k.b) : null, p = {};
  for (const j of F3_J) p[j] = (k[j] || (base ? base[j] : [0, 0, 0])).slice();
  p.pos = (k.pos || (base ? base.pos : [0, 0, 0])).slice();
  [['fL', 'hipL', 'knL', 'anL'], ['fR', 'hipR', 'knR', 'anR']].forEach(([f, h, kn, an], side) => {
    const t = k[f] || (!k[h] && !k[kn] && !k[an] && base && base[f]);
    if (t) { p[f] = t.slice(); f3Leg(p, side, p[f]); }
  });
  return F3.memo[name] = p;
}

// The pose between a and b (t from 0 to 1); ankle targets blend when both poses have one.
function f3Mix(a, b, t) {
  const o = {pos: f3Lerp3(a.pos, b.pos, t)};
  for (const j of F3_J) o[j] = f3Lerp3(a[j], b[j], t);
  if (a.fL && b.fL) o.fL = f3Lerp3(a.fL, b.fL, t);
  if (a.fR && b.fR) o.fR = f3Lerp3(a.fR, b.fR, t);
  return o;
}

// Two-bone IK for one leg (side 0 left, 1 right): hip flexion and abduction and knee bend so the ankle reaches t
// (model space), then the ankle undoes the chain so the sole is level and turned with the pelvis.
function f3Leg(p, side, t) {
  const B = F3_BONE, h = side ? B.hipR : B.hipL, L1 = -B.knL[2], L2 = -B.anL[2], D = F3_DEG, v = F3.v, m = F3.m, m2 = F3.m2, e = F3.e;
  const P = p.pelvis, pel = F3.m3.makeRotationFromEuler(e.set(P[0] * D, P[1] * D, P[2] * D));
  // The target from the hip, in the pelvis frame.
  v.set(h[1], h[2], h[3]).applyMatrix4(pel);
  v.set(t[0] - B.pelvis[1] - p.pos[0] - v.x, t[1] - B.pelvis[2] - p.pos[1] - v.y, t[2] - B.pelvis[3] - p.pos[2] - v.z);
  v.applyMatrix4(m.copy(pel).transpose());
  const len = v.length(), d = Math.min(L1 + L2 - 1e-4, Math.max(.05, len));
  v.multiplyScalar(d / len);
  // Knee bend from the distance; the bent leg (ankle at (0, vy, vz) in the hip frame) turned onto the target:
  // abduction g about z, then flexion a about x.
  const cosK = Math.max(-1, Math.min(1, (d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2))), k = Math.acos(cosK);
  const vy = -L1 - L2 * cosK, vz = -L2 * Math.sin(k), g = Math.asin(Math.max(-1, Math.min(1, -v.x / vy)));
  let a = Math.atan2(v.z, v.y) - Math.atan2(vz, vy * Math.cos(g));
  a = Math.atan2(Math.sin(a), Math.cos(a));
  p[side ? 'hipR' : 'hipL'] = [a / D, 0, g / D]; p[side ? 'knR' : 'knL'] = [k / D, 0, 0];
  // Ankle = (pelvis * hip * knee)^-1 * (the pelvis's turn): the sole level, pointing where the hips point.
  m.copy(pel).multiply(m2.makeRotationFromEuler(e.set(a, 0, g))).multiply(m2.makeRotationX(k)).transpose();
  e.setFromRotationMatrix(m.multiply(m2.makeRotationY(P[1] * D)));
  p[side ? 'anR' : 'anL'] = [e.x / D, e.y / D, e.z / D];
}

// Legs with a target solved, then only the joints and pos (a fresh object).
function f3Solve(p) {
  if (p.fL) f3Leg(p, 0, p.fL);
  if (p.fR) f3Leg(p, 1, p.fR);
  const o = {pos: p.pos};
  for (const j of F3_J) o[j] = p[j];
  return o;
}

// The pose of fighter F now: a pure function of F.act, F.af, F.x and F.face (walk), F.air, F.vy, F.hit (throw),
// F.land (landing) and S.frame (breathing).
function poseOf(F, S) {
  const m = CFG.moves[F.act];
  return f3Solve(m ? f3Move(F, m) : f3Act(F, S));
}

// Moves follow their frame data: from the posture to the wind-up by the end of startup, the strike held through the
// active frames, back to the posture by the end of recovery; kicks fold back through the wind-up (the chamber) first.
// Air moves hold a recovery pose until landing: kicks the chamber, punches most of the way back to the air pose.
const F3_FROM = {cp: 'crouch', ck: 'crouch', chp: 'crouch', chk: 'crouch'};
function f3Move(F, m) {
  const id = F.act, af = F.af, air = m.r === 'land', from = air ? f3Air(F) : f3Key(F3_FROM[id] || 'stance');
  const W = F3_KEY[id + 'W'] ? f3Key(id + 'W') : from, H = F3_KEY[id + 'H'] ? f3Key(id + 'H') : from;
  if (af <= m.s) return f3Mix(from, W, f3Smooth(af / m.s));
  if (af <= m.s + m.a) return f3Mix(H, H, 0);
  const kick = m.limb[0] === 'f', since = af - m.s - m.a;
  if (air) return kick ? f3Mix(H, W, f3Smooth(since / 8)) : f3Mix(H, from, .6 * f3Smooth(since / 8));
  const t = since / m.r;
  if (kick) return t < .5 ? f3Mix(H, W, f3Smooth(2 * t)) : f3Mix(W, from, f3Smooth(2 * t - 1));
  return f3Mix(H, from, f3Smooth(t));
}

// The air pose: tucked while rising, legs reaching down while falling.
function f3Air(F) { return f3Mix(f3Key('airUp'), f3Key('airDown'), f3Smooth((CFG.jump.v - F.vy) / (2 * CFG.jump.v))); }

function f3Act(F, S) {
  const K = f3Key, af = F.af, st = K('stance');
  switch (F.act) {
    case 'walkF': case 'walkB': return f3Walk(F);
    case 'crouch': return f3Breathe(f3Mix(st, K('crouch'), f3Smooth(af / 4)), S);
    case 'guard': return f3Breathe(f3Mix(st, K('guard'), f3Smooth(af / 3)), S);
    case 'guardC': return f3Breathe(f3Mix(st, K('guardC'), f3Smooth(af / 4)), S);
    case 'jumpSquat': return f3Mix(st, K('squat'), f3Smooth(af / 3));
    case 'landing': return f3Mix(K('squat'), st, f3Smooth(af / Math.max(1, F.land)));
    case 'air': return f3Air(F);
    case 'dashF': return f3Mix(st, K('dashF'), f3InOut(af, CFG.dash.f.n));
    case 'dashB': return f3Mix(st, K('dashB'), f3InOut(af, CFG.dash.b.n));
    // Block and hit snap into their recoil on the contact frame (af 0 through the hitstop), then ease back.
    case 'block': return f3Mix(K('blockHit'), K('guard'), f3Smooth((af - 2) / 10));
    case 'hitStun': return f3Mix(K('hurt'), st, .5 * f3Smooth((af - 6) / 14));
    case 'juggle': case 'knock': case 'ko': {   // flying (tilting back as it falls), then lying on the floor
      if (F.air) return f3Mix(K('flyUp'), K('flyDown'), f3Smooth((60 - F.vy) / 140));
      const down = K(F.act === 'ko' ? 'koDown' : 'down');
      return f3Mix(down, down, 0);
    }
    case 'getup': return af < 5 ? f3Mix(K('down'), K('sit'), f3Smooth(af / 5)) : af < 10 ? f3Mix(K('sit'), K('kneel'), f3Smooth((af - 5) / 5))
      : f3Mix(K('kneel'), st, f3Smooth((af - 10) / 6));
    case 'rollF': case 'rollB': return f3Roll(F);
    case 'thr': return f3Throw(F);
    case 'thrWhiff': return f3Mix(K('reach'), st, f3Smooth((af - 4) / 18));
    case 'thrown': return f3Mix(st, K('held'), f3Smooth(af / 4));
    case 'spec': return f3Spec(af);
    case 'win': return f3Breathe(f3Mix(st, K('win'), f3Smooth(af / 12)), S);
    case 'intro': return f3Breathe(f3Mix(K('intro'), K('intro'), 0), S);
    default: return f3Breathe(f3Mix(st, st, 0), S);   // idle
  }
}

// 1 for a timed action's middle, easing in over its first 3 frames and out over its last 5.
function f3InOut(af, n) { return Math.min(f3Smooth(af / 3), f3Smooth((n - af) / 5)); }

// Breathing on the free stances: the chest and shoulders rise and fall (the IK keeps the feet planted).
function f3Breathe(p, S) {
  const B = F3_BREATH, b = Math.sin(S.frame * B.rate);
  p.chest[0] += B.chest * b; p.pos[1] += B.rise * b; p.shL[2] += B.chest * b; p.shR[2] -= B.chest * b;
  return p;
}

// Walk: the stance's feet step along the walking line (the world x axis seen from the model) by distance, F.x * face:
// each foot is planted for half a stride, moving back under the body exactly as far as the body moves, then swings.
function f3Walk(F) {
  const W = F3_WALK, k = f3Smooth(F.af / W.fade), p = f3Mix(f3Key('stance'), f3Key(F.act), k);
  const ph = F.x * F.face / 1000 / W.stride, wx = F.face * Math.cos(F3_YAW), wz = Math.sin(F3_YAW), D = W.stride / 2;
  [['fL', 0], ['fR', .5]].forEach(([f, o]) => {
    const u = ((ph + o) % 1 + 1) % 1, sw = u >= .5, s = sw ? D * (2 * u - 1.5) : D * (.5 - 2 * u);
    const t = p[f], lift = sw ? W.lift * Math.sin(Math.PI * (2 * u - 1)) : 0;
    p[f] = [t[0] + wx * s * k, t[1] + lift * k, t[2] + wz * s * k];
  });
  return p;
}

// Rolls: lying on the back the body tucks into a ball, which then tumbles (450° forward, 270° back: both end upright)
// about its own centre, opens into the crouch (the feet go straight down to the floor: IK from where the ball's feet
// are) and rises into the stance. F3_TUCK = the ball's centre (y, z in the pelvis frame) and radius, measured on the
// meshes in the tuck pose: measure again if the tuck or the shapes change.
const F3_TUCK = {y: -.037, z: .238, r: .4};
function f3Roll(F) {
  const t = F.af / CFG.knock.roll, spin = F.act === 'rollF' ? 450 : -270, cr = f3Key('crouch');
  if (t >= .8) return f3Mix(cr, f3Key('stance'), f3Smooth((t - .8) / .2));
  const a = -90 + spin * f3Smooth((t - .15) / .6), r = a * F3_DEG, c = F3_TUCK, p = f3Mix(f3Key('down'), f3Key('tuck'), f3Smooth(t / .2));
  const y = c.r - F3_BONE.pelvis[2] - (c.y * Math.cos(r) - c.z * Math.sin(r)), z = -(c.y * Math.sin(r) + c.z * Math.cos(r));
  p.pelvis[0] = a; p.pos = f3Lerp3(f3Key('down').pos, [0, y, z], f3Smooth(t / .2));
  if (t < .65) return p;
  const end = f3Mix(cr, cr, 0);
  end.pelvis[0] += spin - 90;   // the crouch's pitch, after the whole turn
  p.fL = f3Ankle(p, 0); p.fR = f3Ankle(p, 1);
  return f3Mix(p, end, f3Smooth((t - .65) / .15));
}

// Model-space ankle of a leg of pose p (forward kinematics, as the rig computes it).
function f3Ankle(p, side) {
  const B = F3_BONE, D = F3_DEG, h = side ? B.hipR : B.hipL, H = p[side ? 'hipR' : 'hipL'], K = p[side ? 'knR' : 'knL'], P = p.pelvis;
  const v = F3.v.set(0, B.anL[2], 0).applyMatrix4(F3.m.makeRotationFromEuler(F3.e.set(K[0] * D, K[1] * D, K[2] * D)));
  v.y += B.knL[2]; v.applyMatrix4(F3.m.makeRotationFromEuler(F3.e.set(H[0] * D, H[1] * D, H[2] * D)));
  v.set(v.x + h[1], v.y + h[2], v.z + h[3]).applyMatrix4(F3.m.makeRotationFromEuler(F3.e.set(P[0] * D, P[1] * D, P[2] * D)));
  return [v.x + B.pelvis[1] + p.pos[0], v.y + B.pelvis[2] + p.pos[1], v.z + B.pelvis[3] + p.pos[2]];
}

// Throw: the reach on the attempt (a miss goes on in thrWhiff); after a grab (F.hit, af from 1 again) hold, pull back
// and shove at thr.hitF, the frame the throw hits, then back to the stance.
function f3Throw(F) {
  const K = f3Key, af = F.af, t = CFG.thr;
  if (!F.hit) return f3Mix(K('stance'), K('reach'), f3Smooth(af / t.s));
  if (af <= t.hitF - 8) return f3Mix(K('reach'), K('clinch'), f3Smooth(af / 6));
  if (af < t.hitF) return f3Mix(K('clinch'), K('tossW'), f3Smooth((af - t.hitF + 8) / 6));
  return f3Mix(K('toss'), K('stance'), f3Smooth((af - t.hitF - 2) / (t.anim - t.hitF - 2)));
}

// Special: charge until 2 frames before the shot, thrust on the spawn frame, hold, then back to the stance.
function f3Spec(af) {
  const K = f3Key, n = CFG.spec.spawn, r = CFG.spec.rec;
  if (af <= n - 2) return f3Mix(K('stance'), K('specW'), f3Smooth(af / (n - 2)));
  if (af <= n) return f3Mix(K('specW'), K('specH'), f3Smooth((af - n + 2) / 2));
  return f3Mix(K('specH'), K('stance'), f3Smooth((af - n - 10) / (r - 10)));
}

// Entry point: game state, the fixed step and boot. Later tasks add the full real-time loop (tick) and the menus.
const G={state:'boot',mode:null,S:null,acc:0,last:0};
// Input first, then the renderer: the title comes only once the arena's textures are decoded.
function boot(){inputInit();renderInit().then(()=>{G.state='title';requestAnimationFrame(drawLoop);});}
// Until the full loop (tick) exists: every animation frame redraws the title or the fight; the sim does not step here.
function drawLoop(now){if(G.state==='fight'||G.state==='title') renderFrame(G.S,now);requestAnimationFrame(drawLoop);}
// One game step: read the inputs (player 1 is the dummy in training), advance the sim, hand its events to the effects and the HUD.
function stepGame(now){
  const S=G.S;
  const in0=typeof inputRead==='function'?inputRead(0):0;
  const in1=S.mode==='training'?dummyInput(S,1):typeof inputRead==='function'?inputRead(1):0;
  simStep(S,in0,in1);
  if(typeof fxEvents==='function') fxEvents(S,now);
  if(typeof hudEvents==='function') hudEvents(S);
}
// n game steps, then one render if there is a renderer.
function frame(n){
  const now=performance.now();
  for(let i=0;i<n;i++) stepGame(now);
  if(typeof renderFrame==='function') renderFrame(G.S,now);
}
function startMatch(mode,o){
  o=o||{};
  G.S=simCreate({seed:o.seed===undefined?1:o.seed,mode,chars:['ren','kael'],dummy:o.dummy});
  G.mode=mode; G.state='fight'; touchShow(true);
}
boot();

})();
</script>
