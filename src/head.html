<title>Voidrise Fighters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff7a1a;--yellow:#ffc83a;--cyan:#35d8ff;--violet:#9b5fe0;--ink:#f4f1ea;--dark:#14121c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);overflow:hidden;font-family:'Barlow Condensed',system-ui,sans-serif;font-style:italic;font-weight:700;touch-action:none;user-select:none}
#app{position:fixed;inset:0;background:var(--dark)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud,#ui{position:absolute;inset:0;pointer-events:none}
/* #ui lets pointers through: any overlay (menu, pause, result) inside #ui must set pointer-events:auto on itself */
#ui{pointer-events:none}
/* touch controls: stick bottom-left (floating), attack buttons bottom-right, as in docs/ref/riferimento-stile.png */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:40%;height:70%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:112px;height:112px;border-radius:50%;background:rgba(20,18,28,.45);border:2px solid rgba(244,241,234,.55);pointer-events:none}
#stickBase.idle{left:calc(env(safe-area-inset-left) + 44px);bottom:26px;opacity:.55}
#stickKnob{position:absolute;left:26px;top:26px;width:56px;height:56px;border-radius:50%;background:rgba(244,241,234,.5);border:2px solid rgba(244,241,234,.85)}
#cluster{position:absolute;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tRow{display:flex;gap:10px;align-items:flex-end}
.tBtn{pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);
  background:rgba(20,18,28,.55);border:2px solid rgba(244,241,234,.7);box-shadow:0 2px 8px rgba(0,0,0,.4);
  font-size:13px;letter-spacing:.04em;line-height:1;transition:transform .06s,filter .06s}
.tBtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tBtn span{pointer-events:none}
.tRound{width:76px;height:76px;border-radius:50%;gap:3px}
.tPill{width:118px;height:44px;border-radius:22px;flex-direction:row;gap:6px}
.tPill svg{width:22px;height:22px}
#tS{background:rgba(255,122,26,.55);border-color:var(--yellow)}
#tK{margin-bottom:14px}
.tBtn.down{transform:scale(.9);filter:brightness(1.5)}
/* HUD: one block per side (0 = Ren left, 1 = Kael right, mirrored), timer in the middle, energy at the bottom corners
   (under the health bar on short screens, so it stays clear of the touch controls), combo counter and banner on top of the fight */
#hud{visibility:hidden;--ptr:polygon(0 0,100% 0,100% 62%,82% 100%,0 100%);--ptr1:polygon(0 0,100% 0,100% 100%,18% 100%,0 62%)}
#hud.on{visibility:visible}
#hudTop{position:absolute;left:calc(env(safe-area-inset-left) + 10px);right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 6px);display:flex;align-items:flex-start;gap:4px}
.hs{flex:1;min-width:0;display:flex;gap:6px;align-items:flex-start}
.hs.r{flex-direction:row-reverse}
.face{flex:none;width:58px;height:50px;background:var(--ink);clip-path:var(--ptr);padding:2px}
.hs.r .face{clip-path:var(--ptr1)}
.face i{display:block;width:100%;height:100%;background:var(--dark) center/cover no-repeat;clip-path:var(--ptr)}
.hs.r .face i{clip-path:var(--ptr1);transform:scaleX(-1)}
.hmid{flex:1;min-width:0}
.nm{font-size:15px;letter-spacing:.06em;line-height:1;margin:1px 8px 2px;text-shadow:0 1px 3px #000}
.hs.r .nm{text-align:right}
.bar{position:relative;height:18px;background:rgba(20,18,28,.7);border:2px solid var(--ink);transform:skewX(-20deg);overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.hs.r .bar{transform:skewX(20deg)}
.bar i{position:absolute;inset:0;transform-origin:100% 50%}
.hs.r .bar i{transform-origin:0 50%}
.chip{background:#e23a2a}
.fill{background:linear-gradient(180deg,#ffe27a,var(--yellow) 45%,#ff9f1a)}
.pips{display:flex;gap:5px;margin:3px 10px 0;height:11px}
.hs.r .pips{justify-content:flex-end}
.pips i{width:11px;height:11px;background:#5b566a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pips i.on{background:var(--orange)}
.mw{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;gap:8px}
.mw.l{left:calc(env(safe-area-inset-left) + 14px)}
.mw.r{right:calc(env(safe-area-inset-right) + 14px);flex-direction:row-reverse}
.lvl{font-family:'Bebas Neue',sans-serif;font-style:italic;font-size:44px;line-height:1;min-width:26px;text-align:center;text-shadow:0 2px 4px #000,0 0 8px rgba(53,216,255,.5)}
.mt{display:flex;gap:4px;transform:skewX(-20deg)}
.mw.r .mt{transform:skewX(20deg)}
.mt i{position:relative;display:block;width:48px;height:12px;background:rgba(20,18,28,.7);border:2px solid var(--ink);overflow:hidden}
.mt b{position:absolute;inset:0;background:linear-gradient(180deg,#9cf0ff,var(--cyan));transform-origin:0 50%}
.mw.r .mt b{transform-origin:100% 50%}
#timerBox{flex:none;position:relative;width:76px;height:50px;margin-top:-2px;display:flex;align-items:center;justify-content:center;background:var(--orange);clip-path:polygon(50% 0,64% 10%,100% 0,90% 50%,100% 100%,64% 90%,50% 100%,36% 90%,0 100%,10% 50%,0 0,36% 10%)}
#timerBox::before{content:'';position:absolute;inset:4px;background:var(--dark);clip-path:polygon(50% 0,64% 10%,92% 8%,86% 50%,92% 92%,64% 90%,50% 100%,36% 90%,8% 92%,14% 50%,8% 8%,36% 10%)}
#timer{position:relative;font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;letter-spacing:.02em}
.combo{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:calc(env(safe-area-inset-left) + 14px);display:none;align-items:flex-end;gap:6px;text-shadow:0 2px 5px #000}
.combo.r{left:auto;right:calc(env(safe-area-inset-right) + 14px);flex-direction:row-reverse}
.combo.on{display:flex}
.combo b{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:.85;color:var(--orange);-webkit-text-stroke:2px #fff2d0;paint-order:stroke fill;transform-origin:50% 80%}
.combo i{font-size:22px;line-height:1;margin-bottom:4px;letter-spacing:.04em}
.combo.bump b{animation:hudBump .22s ease-out}
@keyframes hudBump{0%{transform:scale(1.7) skewX(-8deg)}100%{transform:scale(1) skewX(-8deg)}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:84px;line-height:1;letter-spacing:.05em;color:var(--ink);text-shadow:0 0 18px rgba(255,122,26,.8),0 4px 0 var(--orange),0 6px 14px #000;transform:skewX(-8deg);display:none}
#banner.on{display:block;animation:hudBanner .35s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes hudBanner{0%{opacity:0;transform:skewX(-8deg) scale(1.9)}100%{opacity:1;transform:skewX(-8deg) scale(1)}}
/* short or touch screens: energy under the health bar (the stick and buttons own the bottom corners) */
@media (max-height:480px),(pointer:coarse){
.hmid{position:relative}.mw{position:static;margin:3px 8px 0}.mt i{width:34px;height:8px}.lvl{font-size:22px;min-width:14px}.pips{position:absolute;right:10px;bottom:2px;margin:0}.hs.r .pips{right:auto;left:10px}
}
@media (max-height:480px){
.face{width:48px;height:42px}.bar{height:14px}.nm{font-size:13px}
#timerBox{width:64px;height:42px}#timer{font-size:32px}
.combo{top:calc(env(safe-area-inset-top) + 66px)}.combo b{font-size:48px}.combo i{font-size:18px}
#banner{font-size:60px}
}
</style>
<div id="app"><canvas id="game"></canvas><div id="hud"><div id="hudTop">
<div class="hs" id="hs0"><div class="face"><i id="face0"></i></div><div class="hmid"><div class="nm" id="name0"></div><div class="bar"><i class="chip" id="hpChip0"></i><i class="fill" id="hpFill0"></i></div><div class="pips" id="wins0"><i></i><i></i></div><div class="mw l"><div class="lvl" id="lvl0">0</div><div class="mt" id="meter0"><i><b></b></i><i><b></b></i><i><b></b></i></div></div></div></div>
<div id="timerBox"><div id="timer"></div></div>
<div class="hs r" id="hs1"><div class="face"><i id="face1"></i></div><div class="hmid"><div class="nm" id="name1"></div><div class="bar"><i class="chip" id="hpChip1"></i><i class="fill" id="hpFill1"></i></div><div class="pips" id="wins1"><i></i><i></i></div><div class="mw r"><div class="lvl" id="lvl1">0</div><div class="mt" id="meter1"><i><b></b></i><i><b></b></i><i><b></b></i></div></div></div></div>
</div>

<div id="stickZone"><div id="stickBase" class="idle"><div id="stickKnob"></div></div></div>
