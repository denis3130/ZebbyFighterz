<title>Voidrise Fighters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff7a1a;--yellow:#ffc83a;--cyan:#35d8ff;--violet:#9b5fe0;--ink:#f4f1ea;--dark:#14121c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--dark);color:var(--ink);overflow:hidden;font-family:'Barlow Condensed',system-ui,sans-serif;font-style:italic;font-weight:700;touch-action:none;user-select:none}
#app{position:fixed;inset:0;background:var(--dark)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud,#ui{position:absolute;inset:0;pointer-events:none}
/* #ui lets pointers through: any overlay (menu, pause, result) inside #ui must set pointer-events:auto on itself */
#ui{pointer-events:none}
/* touch controls: stick bottom-left (floating), attack buttons bottom-right, as in docs/ref/riferimento-stile.png */
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:40%;height:70%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:112px;height:112px;border-radius:50%;background:rgba(20,18,28,.45);border:2px solid rgba(244,241,234,.55);pointer-events:none}
#stickBase.idle{left:calc(env(safe-area-inset-left) + 44px);bottom:26px;opacity:.55}
#stickKnob{position:absolute;left:26px;top:26px;width:56px;height:56px;border-radius:50%;background:rgba(244,241,234,.5);border:2px solid rgba(244,241,234,.85)}
#cluster{position:absolute;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tRow{display:flex;gap:10px;align-items:flex-end}
.tBtn{pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);
  background:rgba(20,18,28,.55);border:2px solid rgba(244,241,234,.7);box-shadow:0 2px 8px rgba(0,0,0,.4);
  font-size:13px;letter-spacing:.04em;line-height:1;transition:transform .06s,filter .06s}
.tBtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tBtn span{pointer-events:none}
.tRound{width:76px;height:76px;border-radius:50%;gap:3px}
.tPill{width:118px;height:44px;border-radius:22px;flex-direction:row;gap:6px}
.tPill svg{width:22px;height:22px}
#tS{background:rgba(255,122,26,.55);border-color:var(--yellow)}
#tK{margin-bottom:14px}
.tBtn.down{transform:scale(.9);filter:brightness(1.5)}
</style>
<div id="app"><canvas id="game"></canvas><div id="hud"></div><div id="ui"><div id="touch">
<div id="stickZone"><div id="stickBase" class="idle"><div id="stickKnob"></div></div></div>
<div id="cluster">
<div class="tRow">
<div id="tP" class="tBtn tRound"><svg viewBox="0 0 24 24"><path d="M7 11V7a1.6 1.6 0 0 1 3.2 0v1.5M10.2 8.5V6a1.6 1.6 0 0 1 3.2 0v2.5M13.4 8.5V6.5a1.6 1.6 0 0 1 3.2 0V10M16.6 10V9a1.6 1.6 0 0 1 3.2 0v4.5c0 4-2.6 6.5-6.3 6.5H12c-3 0-5-2-5.6-4.5L5 12.5a1.5 1.5 0 0 1 2.4-1.5z"/></svg><span>PUGNO</span></div>
<div id="tK" class="tBtn tRound"><svg viewBox="0 0 24 24"><path d="M9 3h5l.5 8 5 3.5c1.2.9 1 3-.5 3H6.5C5.5 17.5 5 16.5 5 15.5L7 11z"/><path d="M5 20.5h14"/></svg><span>CALCIO</span></div>
<div id="tS" class="tBtn tRound"><svg viewBox="0 0 24 24"><path d="M12 2.5c.5 3.5 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2 1-3.5 2-4.5.2 1.5 1 2.3 2 2.5C10 8 11 5 12 2.5z"/></svg><span>SPEC</span></div>
</div>
<div class="tRow">
<div id="tDash" class="tBtn tPill"><svg viewBox="0 0 24 24"><circle cx="14.5" cy="4.5" r="2"/><path d="M13 8l-3 4 3 2.5-1.5 5.5M10 12l-4 1M13 8l4 2.5 3-.5M13 14.5l4 2"/><path d="M2 8h3M1 12h3"/></svg><span>SCATTO</span></div>
<div id="tGuard" class="tBtn tPill"><svg viewBox="0 0 24 24"><path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/></svg><span>GUARDIA</span></div>
</div>
</div>
</div></div></div>
